openapi: 3.1.0
info:
  title: Attestation registry API
  version: 0.6.0
  summary: Verified native lifecycle claims, external and directly signed EPCIS event credentials with independent BSV anchors.
  description: |
    Current intake uses explicit signed native claims, the external vc-di-ecdsa-rdfc-2019@1 credential representation or the proposed epcis-event-vc@1 directly signed EPCIS event representation. Missing proof, status, authority or issuer-binding evidence fails closed. Anchor broadcast, credential verification, discovery and confirmed chain inclusion are separate claims.

    The VSC SEAL representation (vsc-seal-json-v1) is parked with its vsc-draft-compat/0.1.0 profile: new submissions are refused as representation-unsupported, and records stored before remain readable without content verification. The contract defines no status list publication: a registry checks the status lists credential issuers publish. The contract has no legacy intake: a historical UORA body names no current representation and is refused as any such body is, while records stored under the historical representation, `legacy-uora-json`, remain readable. Such a record retains no secured bytes, so the record list names it, the proof and chain routes serve its canonical bytes, and the evidence package names it under what the registry could not produce.

    This contract is the minimum every registry serves: its capability document, validation, intake, the paged list of the records it holds, one record's anchor proof, a passport's chain and a passport's evidence package. A registry may offer more; the reference registry documents its own further routes.
servers:
  - url: https://dpp-resolver.bsvb.net
    description: The hosted demonstration deployment
  - url: http://localhost:4000
    description: Local development (npm run dev)

tags:
  - name: resolution
    description: Reading passport state and history.
  - name: attestation
    description: Receiving lifecycle attestations from a publisher.
  - name: validation
    description: Verifying a submission without storing or anchoring it.

paths:
  /chain:
    get:
      tags: [resolution]
      operationId: getChain
      summary: A custody timeline for one passport, with each record's anchor, unbounded or in pages.
      description: |
        The specification describes this endpoint as a human-readable custody
        timeline, not a raw-record dump. An earlier draft of this document had
        it the other way round; corrected after reading the specification.

        Every record is a `ChainRecord`: `anchored`; `anchor` with the outpoint
        (`recordId`, `outputIndex`) and, where anchoring retained them, the
        `format`, the `lockingScript` (hex) and `broadcastAt`; `envelope`, the
        exact secured bytes of a current record or the canonical bytes of a
        historical one; `representation`; `tokenRecordId` when a signed binding
        names one; and `assurance`, the verification recorded at intake. The
        consuming application reads this shape from here rather than inferring
        it from intake receipts.

        Anchor references are included so a caller can follow a fact back to
        its anchor, but a caller needing raw envelopes for independent
        verification should not depend on this endpoint. The consuming app
        verifies chains itself (implementation A) and must keep doing so: no
        verification claim should rest on this endpoint's word. Without
        `limit` or `cursor` the answer is the historical unbounded one, a
        lookup and not an export; with either it is a page of a snapshot
        (`ChainPage`).
      parameters:
        - { name: passportId, in: query, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Anchored records, oldest first; a page of them when paging was asked for.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Chain'
                  - $ref: '#/components/schemas/ChainPage'
        '400':
          description: A malformed request, a `limit` outside 1 to 500 (`limit-invalid`), or a cursor this service did not issue or issued for another query (`cursor-invalid`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/SnapshotExpired' }

  /passports/{passportId}/evidence-package:
    get:
      tags: [attestation]
      operationId: getEvidencePackage
      summary: The dpp-evidence-package@1 for one passport, as this build's JSON envelope.
      description: |
        Everything this registry holds about a passport as content-addressed files under a signed manifest (the standard's portable evidence, section 2): native claims as their canonical stored bytes under `native-claims/`, original secured credentials byte for byte with their representation and media type under `external-credentials/`, retained anchor scripts and any raw anchor transaction the registry still holds under `transactions/`, the newest authenticated status observation of each referenced list under `status/`, the verification policy in force under `authority/`, and the verification report of each record at export under `reports/`. Disclosure scope is `public` and the package is not a recovery backup. `completeness` names the store snapshot the export was read at, what the registry holds and withholds (the operator's verification bundle and the intake results superseded by the reports), and what a record references that the registry could not produce (token history, unretained anchor scripts or transactions, unobserved status lists, historical records without secured bytes).

        The manifest is signed by the registry's anchoring wallet, the
        identity every anchor names as `anchoredBy`: `exporter.id` is that
        identity key and `signature.signer` is its BRC-42 child for the
        protocol `[1, "dpp evidence package v1"]` with the passport identifier
        as key identifier and counterparty `anyone`, derivable by any reader
        from the identity key. Without a configured wallet the export is
        refused (503) rather than served unsigned.

        The standard leaves the archive form to the build; this build serves a
        JSON envelope `{ manifest, files }` with every file base64-encoded
        under its inventory path, as `application/json`. The passport
        identifier travels URL-encoded in one path segment, as the attestation
        identifier does in `/attestations/{id}/proof`.
      parameters:
        - name: passportId
          in: path
          required: true
          description: The passport identifier, URL-encoded.
          schema: { type: string }
      responses:
        '200':
          description: The package.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePackageArchive' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: 'No signing identity is configured, so no package is signed or served.' }

  /capabilities:
    get:
      summary: Current representations, discovery and overlay contracts, and what is explicitly not supported; no certification claim.
      responses:
        '200':
          description: Supported representations and proof suites, the interoperability profiles in force, tm_attestation, ls_attestation, and under `unsupported` the two readiness statements, the parked `vsc-seal-json-v1` and, on a registry holding historical records, `legacy-uora-json`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }

  /attestations:
    get:
      tags: [attestation]
      operationId: listAttestations
      summary: Every attestation this registry holds, in pages of a snapshot.
      description: |
        The collection route of the standard's portable evidence, section 1.
        Always paged: the first page fixes the snapshot at the store's
        high-water insertion sequence and every later page returns records at
        or below it, in insertion sequence then identifier order, so two
        readers of one snapshot receive the same pages and an insert during
        the export shifts nothing. Cursors are opaque, bound to the query and
        the snapshot, and refused by name when altered (`cursor-invalid`) or
        older than ten minutes (`snapshot-expired`, with the instruction to
        restart without a cursor). The default page holds 100 items and the
        maximum 500; another value is `limit-invalid`. Filters select by
        subject (passport identifier), issuer, representation, attestation
        type and the record's own `timestamp` as an inclusive ISO 8601 UTC
        string range.
      parameters:
        - name: subject
          in: query
          description: The passport identifier.
          schema: { type: string }
        - name: issuer
          in: query
          description: The issuer as the stored document names it.
          schema: { type: string }
        - name: representation
          in: query
          description: The stored representation. `vsc-seal-json-v1` selects records stored before that representation was parked.
          schema: { enum: [dpp-lifecycle-json-v1, vsc-seal-json-v1, 'vc-di-ecdsa-rdfc-2019@1', 'epcis-event-vc@1', legacy-uora-json] }
        - name: type
          in: query
          description: The attestation type (a native event type, VSC-SEAL, an external credential's own type, or a historical type).
          schema: { type: string }
        - name: from
          in: query
          description: Inclusive lower bound on the record's own timestamp, ISO 8601 UTC.
          schema: { type: string }
        - name: to
          in: query
          description: Inclusive upper bound on the record's own timestamp, ISO 8601 UTC.
          schema: { type: string }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationPage' }
        '400':
          description: A `limit` outside 1 to 500 (`limit-invalid`) or a cursor this service did not issue or issued for another query (`cursor-invalid`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410': { $ref: '#/components/responses/SnapshotExpired' }
    post:
      tags: [attestation]
      operationId: postAttestation
      summary: Verify and store an explicit secured representation, then report its independent anchor.
      description: |
        Native signature verification precedes storage and anchoring. An external credential requires its proof, status and authority evidence under the operator's policy. The parked `vsc-seal-json-v1` representation, in its envelope or as a SEAL posted as the body, is refused with 422, outcome `unsupported` and an issue naming `representation-unsupported`; nothing is verified, stored or anchored. The request schema does not admit a SEAL: a registry recognises one by its `representation` or by `VSC-SEAL` among its types and answers it this way, not with 400. A JSON object naming no current representation, a historical UORA placeholder or SD-JWT submission among them, is refused with 422, outcome `invalid` and the issue `unsupported representation; an explicit claimFormat or representation is required`, not with 400; nothing is stored or anchored. There is no legacy intake for any body to fall through to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/NativeLifecycleSubmission'
                - $ref: '#/components/schemas/ExternalCredentialSubmission'
                - $ref: '#/components/schemas/EpcisEventSubmission'
      responses:
        '202':
          description: Verified input accepted. Anchored can be false; broadcast is not confirmed inclusion.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, attestationId, digest, representation, mediaType, verdict, verification, anchored, anchorStatus, inclusion]
                properties:
                  accepted: { const: true }
                  attestationId: { type: string }
                  digest: { type: string, pattern: '^[0-9a-f]{64}$' }
                  representation: { enum: [dpp-lifecycle-json-v1, 'vc-di-ecdsa-rdfc-2019@1', 'epcis-event-vc@1'] }
                  mediaType: { enum: [application/json, application/vc+ld+json, application/vc+jwt] }
                  verdict: { const: valid }
                  verification: { type: object, description: Named checks and their evidence scope. }
                  anchored: { type: boolean }
                  anchorStatus: { enum: [unanchored, broadcast] }
                  inclusion: { const: not-evaluated }
                  anchor: { type: object }
                  note: { type: string }
                  unannounced: { type: string }
        '400': { description: 'Malformed or duplicate-key JSON, or a body that is not a JSON object.' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '409':
          description: |
            The identifier is already secured here: `duplicate_attestation`
            for the same bytes, `credential_id_collision` for different bytes
            under one identifier, whose earlier bytes are kept. Nothing is
            stored or anchored either way. For `epcis-event-vc@1` the
            identifier is the Event Hash ID and the collision is judged per
            issuer: another issuer's credential for the same hash ID is a
            second attestation and is accepted; the same issuer's different
            bytes are `credential_id_collision`.
        '422': { description: "Invalid, unsupported or indeterminate verification; nothing stored or anchored. An external credential using a curve, suite or structure the profile does not implement, and any submission of the parked vsc-seal-json-v1 representation, answer here with outcome unsupported. A body naming no current representation, a historical UORA body included, answers here with outcome invalid and the unsupported representation named." }
      security:
        - {}
        - writeToken: []

  /attestations/{id}/proof:
    get:
      tags: [attestation]
      operationId: getAttestationProof
      summary: Everything a third party needs to check the anchor without this service.
      description: |
        The endpoint the whole construction rests on, and the reason this
        layer exists: UORA states that it provides no proof of existence or
        blockchain-style timestamping and assumes an external registry
        supplies it.

        It returns the **canonical bytes**, not only the digest. Serving the
        digest alone would oblige every verifier to reimplement JCS correctly
        before they could check anything, which in practice means they will
        not. With the canonical string, the digest and the outpoint, a
        verifier fetches the raw transaction from any source, decodes the
        PushDrop output and compares. A verifier that reads the chain itself
        never needs this endpoint.
      parameters:
        - name: id
          in: path
          required: true
          description: The attestationId, URL-encoded. For a native claim it is `urn:sha256:` followed by the digest of the claim's complete representation (spec/rules.md section 6).
          schema: { type: string }
      responses:
        '200':
          description: |
            The proof material. `anchored: false` carries `note` with the
            reason instead of an outpoint, never a blank identifier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnchorProof' }
        '404': { $ref: '#/components/responses/NotFound' }

  /validate:
    post:
      tags: [validation]
      operationId: postValidate
      summary: Verify an explicit current representation without storing or anchoring it.
      description: |
        One response shape, which names its contract, `attestation-registry/1`. A current representation (a signed native claim, an external credential envelope or a directly signed EPCIS event envelope) answers with the registry's named outcome and checks and, whenever the evidence names one subject or the caller names one, the shared verification `report`. A SEAL, in the parked `vsc-seal-json-v1` envelope or as the body, answers with outcome `unsupported`, an issue naming `representation-unsupported` and `reportOmitted`; the request schema does not admit a SEAL, and a registry recognises one by its `representation` or by `VSC-SEAL` among its types and answers it this way, not with 400. A JSON object naming no current representation, a historical UORA input among them, answers with outcome `invalid`, the issue `unsupported representation; an explicit claimFormat or representation is required` and `reportOmitted`; the request schema does not admit it either, and a registry answers it this way, not with 400.

        `tokenHistory` is a request property of this operation: a BEEF as hex
        carrying the passport's token states, so the report's token checks can
        run. It is never part of a signed claim or a credential envelope and is
        removed before the bytes are verified. The `subject` query parameter
        names the passport the caller expects (`source: request-context`).
      parameters:
        - name: subject
          in: query
          required: false
          description: The passport identifier the caller independently expects the evidence to concern.
          schema: { type: string, minLength: 1, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ValidateNativeRequest'
                - $ref: '#/components/schemas/ValidateExternalRequest'
                - $ref: '#/components/schemas/ValidateEpcisEventRequest'
      responses:
        '200':
          description: The named verification outcome and checks, with the report where one could be built. No storage, anchor or certification claim.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecuredValidateResult' }
        '400': { description: 'Malformed request, a body that is not a JSON object, or a tokenHistory that does not read as a BEEF.' }

components:
  securitySchemes:
    writeToken:
      type: http
      scheme: bearer
      description: |
        A deployment choice, exactly as persistence is: when the deployment sets `WRITE_TOKEN`, the write operation, `POST /attestations`, requires it as a bearer, because writes store state and, with a treasury configured, spend real satoshis anchoring it. Unset, writes stay open and local development is unchanged, which is why the write operation also lists an empty security requirement. Reads never require it.

  parameters:
    limit:
      name: limit
      in: query
      description: Page size, 1 to 500; 100 when omitted. Asking for pages on `/chain` switches it from the unbounded lookup to pages of a snapshot.
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page. Opaque, bound to the query and the snapshot; never construct or alter one.
      schema: { type: string }

  responses:
    SnapshotExpired:
      description: The cursor's snapshot is older than ten minutes. Restart the export without a cursor to read a fresh snapshot; nothing is continued from the middle.
      content:
        application/json:
          schema:
            type: object
            required: [error, detail, hint]
            properties:
              error: { const: snapshot-expired }
              detail: { type: string }
              hint: { type: string }
    Unauthorised:
      description: >-
        This deployment requires a write token and the request did not
        carry it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Nothing is known under that key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    NativeLifecycleClaim:
      type: object
      description: The signed native claim's properties. Composed into the submission and validation request shapes below, which close the property set.
      required: [claimFormat, eventType, passportId, recordId, timestamp, issuer, issuerKeyId, profile, profile_version, signature]
      properties:
        claimFormat: { const: dpp-lifecycle-v1 }
        eventType: { enum: [Origin, Transfer, Transformation, Disposition] }
        passportId: { type: string, minLength: 1 }
        recordId: { type: string, pattern: '^[0-9a-f]{64}:(0|[1-9][0-9]*)$', description: 'The outpoint of the state the claim is about, <txid>:<outputIndex> (spec/rules.md section 3).' }
        timestamp: { type: string, format: date-time }
        issuer: { type: string, minLength: 1 }
        issuerKeyId: { type: string, minLength: 1 }
        issuerKeyDid: { type: string, description: Requires configured authenticated issuer-to-key binding for non-key issuer identifiers. }
        profile: { type: string, minLength: 1 }
        profile_version: { type: integer, minimum: 1 }
        signature: { type: string, pattern: '^[0-9a-f]+$' }
    NativeLifecycleSubmission:
      allOf:
        - $ref: '#/components/schemas/NativeLifecycleClaim'
      unevaluatedProperties: false
    ValidateNativeRequest:
      description: A signed native claim for `POST /validate`, with the operation's own `tokenHistory` beside it. The claim's signature covers the claim alone; `tokenHistory` is removed before verification.
      allOf:
        - $ref: '#/components/schemas/NativeLifecycleClaim'
      properties:
        tokenHistory: { $ref: '#/components/schemas/TokenHistory' }
      unevaluatedProperties: false
    ExternalCredentialEnvelope:
      type: object
      required: [representation, credential]
      description: |
        The external ecdsa-rdfc-2019 credential representation of the standard's `spec/external-credential-profile.md`: a W3C Verifiable Credentials 2.0 credential secured with a `DataIntegrityProof` under `ecdsa-rdfc-2019` over a P-256 Multikey whose `did:web` issuer lists the key for assertion. Verified through the `exchange` entry point of `@bsv/dpp-credentials` under the `external` section of the operator's verification bundle. The exact issued bytes are what is retained and anchored; a reformatted copy has a different digest even where its RDF proof still verifies.
      properties:
        representation: { const: 'vc-di-ecdsa-rdfc-2019@1' }
        credential: { type: string, description: 'Exact UTF-8 JSON string of the complete issued credential including its proof, at most 256 KiB.' }
        subject:
          type: string
          description: >-
            The passport identifier the caller expects. It never overrides the
            signed subject: it must equal it, or be bound to it by the
            operator's subject-binding policy with an evidence reference, else
            the submission is refused as a subject mismatch.
    ExternalCredentialSubmission:
      allOf:
        - $ref: '#/components/schemas/ExternalCredentialEnvelope'
      unevaluatedProperties: false
    EpcisEventEnvelope:
      type: object
      required: [representation, credential]
      description: |
        The directly signed EPCIS event representation of the standard's
        `spec/epcis-event-profile.md`: a W3C Verifiable Credentials 2.0
        credential whose subject is one GS1 EPCIS 2.0 event and whose `id` is
        the event's CBV 2.0 Event Hash ID, secured as a compact JWS under
        ES256K by the party's published credential key. The exact JWS string
        is what is retained and anchored; uniqueness is per hash ID and issuer.
      properties:
        representation: { const: 'epcis-event-vc@1' }
        credential: { type: string, description: 'The exact compact JWS as issued, at most 2 MiB.' }
        subject:
          type: string
          description: >-
            The object identifier the caller expects, in canonical GS1 Digital
            Link form where it is one. It must be among the identifiers the
            event names, else the submission is refused as a subject mismatch;
            the anchor's subject is the profile's first identifier whatever the
            caller names.
    EpcisEventSubmission:
      allOf:
        - $ref: '#/components/schemas/EpcisEventEnvelope'
      unevaluatedProperties: false
    ValidateEpcisEventRequest:
      description: A directly signed EPCIS event envelope for `POST /validate`, with the operation's own `tokenHistory` beside it.
      allOf:
        - $ref: '#/components/schemas/EpcisEventEnvelope'
      properties:
        tokenHistory: { $ref: '#/components/schemas/TokenHistory' }
      unevaluatedProperties: false
    ValidateExternalRequest:
      description: An external credential envelope for `POST /validate`, with the operation's own `tokenHistory` beside it.
      allOf:
        - $ref: '#/components/schemas/ExternalCredentialEnvelope'
      properties:
        tokenHistory: { $ref: '#/components/schemas/TokenHistory' }
      unevaluatedProperties: false
    Capabilities:
      type: object
      required: [protocol, topic, lookupService, representations, proofSuites, interoperability, unsupported]
      properties:
        protocol: { const: attestation-registry/1 }
        topic: { const: tm_attestation }
        lookupService: { const: ls_attestation }
        representations:
          type: array
          description: The representations intake accepts. The parked `vsc-seal-json-v1` is not among them and is named under `unsupported`.
          items: { enum: [dpp-lifecycle-json-v1, 'vc-di-ecdsa-rdfc-2019@1', 'epcis-event-vc@1'] }
        proofSuites: { type: array, items: { enum: [ecdsa-rdfc-2019, ES256K] } }
        interoperability:
          type: object
          required: [discovery, externalCredential, externalCredentialPolicy]
          properties:
            discovery: { enum: ['gs1-digital-link@1', not-configured] }
            resolverOrigin: { type: string, format: uri }
            externalCredential: { const: 'vc-di-ecdsa-rdfc-2019@1' }
            externalCredentialPolicy: { enum: [configured, not-configured] }
        unsupported:
          type: array
          description: 'What is explicitly not implemented, each with its reason, such as the parked `vsc-seal-json-v1` and, on a registry holding records stored under it, the historical `legacy-uora-json`: records of both stay readable, and neither is accepted as a new submission.'
          items:
            type: object
            required: [id, reason]
            properties:
              id: { type: string }
              reason: { type: string }
        anchoredBy:
          type: string
          pattern: '^0[23][0-9a-f]{64}$'
          description: >-
            The compressed identity key that every anchor this registry writes
            names as anchoredBy, so a verifier can tell this registry's anchors
            from anyone else's without asking, and that its evidence packages
            name as exporter.id, so a reader derives each package's signer. Optional. Naming the key does not
            make the registry trusted: which anchoring services to accept stays
            the verifier's policy.
    TokenHistory:
      type: string
      pattern: '^([0-9a-fA-F]{2})+$'
      description: |
        A BEEF (BRC-62) as hex carrying the passport's token states, so the
        report's token checks (`recordEncoding`, `actorSignatures`,
        `publisherSignatures`, `linkage`, `inclusion`) can run. Absent, they
        report `unknown` with `no-evidence`; this registry holds no token
        history of its own.
    EvidenceCheckName:
      type: string
      description: The sixteen checks of the standard's verification report, in report order.
      enum:
        - recordEncoding
        - actorSignatures
        - publisherSignatures
        - linkage
        - inclusion
        - nativeAttestationSignature
        - anchorSignature
        - anchorKeyDerivation
        - anchorDigestAndMetadataBinding
        - externalCredentialProof
        - subjectBinding
        - issuerAuthority
        - schema
        - credentialTime
        - credentialStatus
        - evidenceAvailability
    EvidenceReport:
      description: |
        The standard's verification report, version 2, exactly as its schema
        defines it: `reportVersion`, `checkedAt`, `expectedSubject`,
        `suppliedTip`, `policyId`, sixteen `checks` in the order
        `EvidenceCheckName` lists them (each `pass`, `fail`, `unknown` or
        `not-applicable` with a `reasonCode` whenever it is not a pass),
        `observations` of the latest state and the `limits` a reader must not
        cross. The schema is the standard's and is referenced rather than
        copied; the check names are embedded here so a reader of this
        document alone sees them. No property summarises the checks into one
        word, by design.
      allOf:
        - $ref: 'https://bsv-blockchain.github.io/dpp/contracts/verification-report.schema.json'
        - type: object
          properties:
            reportVersion: { const: '2' }
            checks:
              type: array
              minItems: 16
              maxItems: 16
              items:
                type: object
                properties:
                  name: { $ref: '#/components/schemas/EvidenceCheckName' }
                  status: { enum: [pass, fail, unknown, not-applicable] }
    SecuredValidateResult:
      type: object
      description: |
        Every 200 answer of `POST /validate`: a current representation
        verified, a parked SEAL refused as `unsupported` or a body naming no
        current representation refused as `invalid`. `outcome`, `issues`
        and `checks` are the registry's own verification of the bytes;
        `report` is the shared contract's per-check account of the same
        bytes, present whenever the evidence names one subject or the caller
        named one, and `reportOmitted` says why otherwise. A report is built
        whether or not the bytes verified: a failed proof is a finding the
        report carries, not a reason to withhold it.
      required: [contract, outcome, issues]
      properties:
        contract: { const: attestation-registry/1 }
        outcome:
          enum: [verified, invalid, indeterminate, unsupported]
          description: '`unsupported` names a representation, or a feature of one, this registry does not implement: an external credential on another curve, suite or structure, or the parked `vsc-seal-json-v1`, whose issue names `representation-unsupported`. A body naming no current representation, a historical UORA input included, is `invalid` with the issue `unsupported representation; an explicit claimFormat or representation is required`.'
        issues: { type: array, items: {} }
        checks: { description: "The registry's named checks with their evidence scope." }
        tokenRecordId: { type: string, pattern: '^[0-9a-f]{64}$' }
        report: { $ref: '#/components/schemas/EvidenceReport' }
        reportOmitted: { type: string, description: Why no report accompanies this answer. }
        lifecycleMapping:
          $ref: '#/components/schemas/LifecycleMapping'
          description: Native claims only, when a report was built; with `tokenHistory` supplied the native operation is read from the cited token state.
    ClaimRelation:
      type: object
      description: |
        What one claim says about another, recorded independently of token spending and never implied by a passport changing hands. `from` is the relating artefact (an attestation identifier, or a status list position `<list>#<index>`), `to` the attestation the relation is about. A claim can be historically authentic and currently superseded; both records stay. `expires` is derived from a signed `validUntil` at evaluation time and never stored. `supersedes` and `disputes` have no producing path: no current representation carries a field naming a superseded or disputed claim, and none is inferred. The sources `conflict-cascade`, `vsc-correction`, `vsc-parent` and `status-publication` are no longer produced, since the historical intake and its conflict cascade left the contract, the SEAL representation is parked and the contract defines no status list publication; relations recorded under them stay readable.
      required: [kind, from, to, source, reason, recordedAt]
      properties:
        kind: { enum: [supersedes, revokes, suspends, expires, disputes] }
        from: { type: string }
        to: { type: string }
        source: { enum: [conflict-cascade, vsc-correction, vsc-parent, status-publication, status-observation, validity-window] }
        reason: { type: string }
        recordedAt: { type: string, format: date-time }
        clearedAt: { type: string, format: date-time, description: 'Suspensions only, when the suspension was cleared. The record stays.' }
    ClaimConflict:
      type: object
      description: |
        Claims competing over one predecessor: custody claims naming the same
        token state or parent SEAL from different issuers, or transformations
        consuming one input. Independent assessments never compete. Resolution
        is authority-first and only within one comparable named trust framework
        and anchor; otherwise the conflict is unresolved with every candidate
        named. Timestamps never decide, and there is never a silent winner.
      required: [kind, over, candidates, resolution, rule, reason]
      properties:
        kind: { enum: [custody, transformation] }
        over: { type: string, description: The token state (`token-state:<id>`) or parent SEAL the candidates compete over. }
        candidates:
          type: array
          minItems: 2
          items:
            type: object
            required: [attestationId, issuer, timestamp]
            properties:
              attestationId: { type: string }
              issuer: { type: string }
              timestamp: { type: string }
        resolution: { enum: [resolved, unresolved] }
        winner: { type: string, description: Present only when resolved. }
        rule: { type: string }
        reason: { type: string }
    ClaimRelations:
      type: object
      required: [relations, derived, conflicts, notProduced, evaluatedAt]
      properties:
        relations:
          type: array
          items: { $ref: '#/components/schemas/ClaimRelation' }
          description: Stored relations naming this record as `from` or `to`, oldest first.
        derived:
          type: array
          items: { $ref: '#/components/schemas/ClaimRelation' }
          description: Relations computed at `evaluatedAt` and never stored; today `expires`.
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/ClaimConflict' }
        notProduced:
          type: array
          items: { type: string }
          description: The relation kinds no current intake can produce, stated rather than left to be assumed absent.
        evaluatedAt: { type: string, format: date-time }
    LifecycleMapping:
      type: object
      description: |
        The conditional lifecycle mapping of a native claim (the standard's
        `spec/rules.md` §2, through `mapNativeOperation` in the profiles
        package): a native operation maps to an external lifecycle event only
        when the evidence the profile requires is present. The native operation
        is read from the token state the claim names when the caller supplied
        the token history, and otherwise derived from the claim's event type
        and said to be. `evidenceFacets` names the facets of spec/rules.md §2
        the mapping was given, `facility`, `time`, `responsibleParty`,
        `source`, `destination`, `custodyRecord`, `workDone`, `performedBy`,
        `performedAt`, `dispositionKind` and `outputs`, each a reference to a
        record, never a flag; a native claim carries none (§3). No outcome
        other than `lossless` comes without its list of what was lost or is
        missing: a TRANSFER without a `custodyRecord` is `insufficient-data`,
        and a token transfer is never read as a shipment.
      required: [profile, nativeOperation, nativeOperationSource, evidenceFacets, outcome, missingEvidence, losses, mappedFields, unmappedFields]
      properties:
        profile: { type: string, description: '`{id}@{version}` the mapping was computed under.' }
        nativeOperation: { enum: [ACTIVATE, SOLD, RESOLD, REPAIRED, RECYCLED, EDIT, TRANSFER, ISSUE, UPDATE, RETIRE] }
        nativeOperationSource: { enum: [token-state, event-type] }
        evidenceFacets: { type: array, items: { type: string } }
        outcome: { enum: [lossless, transformed, unsupported, insufficient-data] }
        eventType: { type: string }
        externalEvent: { type: string }
        missingEvidence: { type: array, items: { type: string } }
        losses: { type: array, items: { type: string } }
        mappedFields:
          type: array
          items:
            type: object
            required: [key, semanticUri]
            properties:
              key: { type: string }
              semanticUri: { type: string }
        unmappedFields: { type: array, items: { type: string } }
    Problem:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
        stub:
          type: boolean
          description: |
            Present only on a response that has not been fully earned. No
            successful answer of this contract sets it; a registry may set it
            on an error answer.

    ChainIntegrity:
      type: string
      description: |
        The specification's chain state, present only when every record in
        the history is a UORA-shaped attestation this layer could actually
        assess: `intact` when every antecedent resolves (within the history
        or the wider registry) to a record that is not superseded, `broken`
        on a gap or a cycle, and `invalid` when an antecedent resolves to a
        **superseded** record: the link exists, but the specification
        forbids computing state over it, which is a different failure from
        the link being missing. The app's placeholder payloads are not
        assessable, so histories of them carry no field at all. A caller
        must treat absence as "not checked here" and verify independently.
      enum: [intact, broken, invalid]

    AnchorRef:
      type: object
      description: |
        A reference to the anchoring record. Deliberately opaque at this
        layer: a consuming application should not show it to a user.
      required: [recordId]
      properties:
        recordId:
          type: string
          description: The anchoring transaction identifier, hex.
        outputIndex:
          type: integer
          description: The anchor output's index in that transaction; 0 for every anchor this registry writes.
        broadcastAt:
          type: string
          format: date-time
          description: When the registry handed the transaction to the network; not confirmed inclusion.
        format:
          type: string
          enum: [uora-anchor-v1, uora-anchor-v2, uora-anchor-v3, bsv-attestation-anchor-v1]
          description: Which anchor layout was written; absent on the oldest records.
        lockingScript:
          type: string
          pattern: '^[0-9a-f]+$'
          description: The anchor output's locking script, hex, where the registry retained it; absent otherwise. Decode it with the parser for `format` and compare its digest and metadata with the record's secured bytes; a verifier that also reads the output from the chain requires the two to be equal.
        blockHeight:
          type: integer
          minimum: 0
          description: >-
            The height of the block that includes the anchor transaction, where
            the registry holds its merkle path. Optional; absent while the
            transaction is unmined or when the registry keeps no path.
        merklePath:
          type: string
          pattern: '^[0-9a-f]+$'
          description: >-
            The anchor transaction's merkle path as a BUMP (BRC-74), hex, where
            the registry holds one. Optional. It saves a verifier a request to a
            chain source, not a check: the verifier still compares the path's
            root with the block header at its height, and asks a chain source
            when the path is absent or does not match.
    ChainRecord:
      type: object
      description: One record of a passport's custody timeline, exactly as `GET /chain` serves it.
      required: [anchored, representation, assurance]
      properties:
        anchored:
          type: boolean
          description: |
            False while the record has no anchor, in which case `anchor`
            is absent rather than present with a blank identifier.
        anchor: { $ref: '#/components/schemas/AnchorRef' }
        envelope:
          type: string
          description: The exact secured bytes of a current record (the bytes its digest commits to), or the canonical bytes of a historical record.
        representation: { enum: [legacy-uora-json, dpp-lifecycle-json-v1, vsc-seal-json-v1, 'vc-di-ecdsa-rdfc-2019@1', 'epcis-event-vc@1'] }
        tokenRecordId:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The token record a signed binding names, when the record carries one.
        assurance:
          type: object
          additionalProperties: true
          description: >-
            The verification recorded at intake. Historical records carry
            `classification` `legacy` and `currentVerification` `not-evaluated`.
    AttestationSummary:
      type: object
      description: One item of `GET /attestations`, the record's identity, provenance and anchor, never its bytes.
      required: [attestationId, passportId, representation, attestationType, timestamp, receivedAt, digest, anchored]
      properties:
        attestationId: { type: string }
        passportId: { type: string }
        issuer: { type: string }
        representation: { enum: [legacy-uora-json, dpp-lifecycle-json-v1, vsc-seal-json-v1, 'vc-di-ecdsa-rdfc-2019@1', 'epcis-event-vc@1'] }
        attestationType: { type: string }
        timestamp: { type: string }
        receivedAt: { type: string, format: date-time }
        sequence:
          type: integer
          minimum: 1
          description: The store's insertion sequence, which is the page order.
        digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        status: { type: string }
        anchored: { type: boolean }
        anchor: { $ref: '#/components/schemas/AnchorRef' }
    PageEnvelope:
      type: object
      description: |
        One page of an export over a stable snapshot, in the shape of the
        standard's paginated-history schema
        (https://bsv-blockchain.github.io/dpp/contracts/paginated-history.schema.json).
        `truncated` is true when a limit cut the page; `completeForSnapshot` is
        true only on the last page, and says nothing about records outside the
        snapshot.
      required: [pageVersion, items, nextCursor, snapshotId, scope, truncated, completeForSnapshot, pageSize]
      properties:
        pageVersion: { const: '1' }
        items: { type: array, maxItems: 500 }
        nextCursor:
          type: [string, 'null']
          description: Opaque, bound to the query and the snapshot; null when exhausted.
        snapshotId:
          type: string
          description: '`seq-<n>`, the store''s high-water insertion sequence at the first page.'
        scope:
          type: object
          required: [source, query]
          properties:
            source: { type: string }
            query: { type: object, additionalProperties: { type: string } }
            sequenceRange:
              type: object
              properties:
                from: { type: integer, minimum: 0 }
                to: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        completeForSnapshot: { type: boolean }
        pageSize: { type: integer, minimum: 1, maximum: 500 }
    AttestationPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AttestationSummary' }
    ChainPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          required: [passportId]
          properties:
            passportId: { type: string }
            items:
              type: array
              items: { $ref: '#/components/schemas/ChainRecord' }
    EvidencePackageArchive:
      type: object
      description: |
        This build's archive form of a `dpp-evidence-package@1`: the manifest
        (the standard's schema at
        https://bsv-blockchain.github.io/dpp/contracts/evidence-package.schema.json)
        and every inventoried file, base64-encoded under its path. A reader
        decodes the files, checks each against the inventory's length and
        digest, and verifies the manifest signature with `signature.signer`,
        the anchoring identity's derived key.
      required: [manifest, files]
      properties:
        manifest:
          $ref: 'https://bsv-blockchain.github.io/dpp/contracts/evidence-package.schema.json'
        files:
          type: object
          additionalProperties: { type: string, contentEncoding: base64 }

    AnchorProof:
      type: object
      description: |
        What a verifier is handed. Complete on its own: nothing here requires
        a second call to this service, which is the property the layer is
        arguing for.
      required: [attestationId, attestation, claimRelations, canonical, digest, algorithm, anchored]
      properties:
        attestationId: { type: string }
        attestation:
          type: object
          additionalProperties: true
          description: |
            The parsed stored document. Current verifiers hash securedBytes;
            serialising this parsed object may change a VSC byte commitment.
        claimRelations: { $ref: '#/components/schemas/ClaimRelations' }
        canonical:
          type: string
          description: |
            Compatibility property containing the bytes that were hashed.
            Current records also name these bytes explicitly as securedBytes.
            Only historical and native representations use canonicalisation.
        securedBytes:
          type: string
          description: Exact secured representation bytes expressed as a UTF-8 JSON string, present on current records.
        representation:
          enum: [legacy-uora-json, dpp-lifecycle-json-v1, vsc-seal-json-v1, 'vc-di-ecdsa-rdfc-2019@1', 'epcis-event-vc@1']
        mediaType:
          enum: [application/json, application/vc+ld+json, application/vc+jwt]
        assurance:
          type: object
          additionalProperties: true
          description: Named ingestion verification checks, separate from current status or chain inclusion.
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lower-case hex SHA-256 over `canonical`.
        algorithm:
          type: string
          description: Names the construction, so the check is reproducible from this response alone.
          examples: ['JCS (RFC 8785) then SHA-256, hex']
        anchored:
          type: boolean
          description: |
            False when the attestation was stored but never anchored, which is
            a first-class state rather than an error. `anchor` is then absent
            and `note` says why.
        anchor: { $ref: '#/components/schemas/AnchorRef' }
        note:
          type: string
          description: Why the record is unanchored. Present only when `anchored` is false.
        howToCheck:
          type: string
          description: |
            The procedure in one sentence, carried in the response so a
            verifier who has only this JSON still knows what to do with it.

    Chain:
      type: object
      description: The unbounded custody timeline; a lookup, not an export.
      required: [passportId, records]
      properties:
        passportId: { type: string }
        records:
          type: array
          items: { $ref: '#/components/schemas/ChainRecord' }
        chainIntegrity: { $ref: '#/components/schemas/ChainIntegrity' }
        stub: { type: boolean }
