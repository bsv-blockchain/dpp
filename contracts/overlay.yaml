openapi: 3.1.0
info:
  title: DPP overlay profile
  version: 0.14.0-draft
  description: >-
    A profile of the BSV ecosystem's overlay HTTP contract for the two rails
    this standard adds. Status: working draft, pre-1.0. The wire is the
    ecosystem's, BRC-22 submission and BRC-24 lookup with STEAK answers and
    BEEF throughout, and it is not restated here: a conforming index implements
    the upstream contract named under externalDocs, and this document pins only
    what the standard adds or fixes on top of it. It has a core and
    extensions. The core (x-dpp-profile, versioned by x-dpp-core-version) is
    what the contract asks of every conforming index: the current and
    historical topics, their admission rules, lookup services and core query
    shapes, and which upstream options an index must, should or may
    implement. The core version
    changes only when the record versions the topics admit change or a must
    changes, never for a should, a may or an extension. Each extension
    (x-dpp-extensions) is optional, carries its own version, which changes only
    with that extension, and marks the operations, headers and properties it
    adds with x-dpp-extension. An index may serve more than this document
    names: the reference package documents its own further routes.
    Findability is a service concern, not a truth concern: nothing returned
    here is trusted until it verifies as the specification documents
    describe.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
externalDocs:
  description: >-
    The upstream overlay HTTP contract this profile extends: ts-stack
    specs/overlay/overlay-http.yaml, served by @bsv/overlay-express and
    consumed by the @bsv/sdk overlay tools.
  url: https://bsv-blockchain.github.io/ts-stack/specs/overlay-http/
x-dpp-core-version: '1'
x-dpp-profile:
  upstream: https://bsv-blockchain.github.io/ts-stack/specs/overlay-http/
  topics:
    tm_dpp: >-
      The passport rail. Admits a transaction's single DPP output when it
      decodes under spec/record-model.md (fourteen fields) or
      spec/record-model-v2.md (seventeen fields), its actor signature verifies
      under its version's preimage, its publisher signature verifies against
      the index's configured service key (admission policy, never token
      validity), and it is either a valid genesis or spends the admitted tip
      under its version's chain invariants. A version 2 state also names the
      spent outpoint and the lineage genesis, which the index traces through
      the submitted bytes or its own history, proves control of the
      predecessor, and is refused after a RETIRE; a version 2 UPDATE may
      spend a version 1 tip (the upgrade) and nothing else crosses versions.
      Spent tips are retained so the lifecycle stays resolvable. A version 1
      TRANSFER has no control rule (spec/custody.md section 4). When
      deployed for managed-custody@2 (spec/managed-custody.md), a version 2
      TRANSFER is refused without its acceptance commitment. Record version
      3, the token carrier, is parked outside the standard, and an output in
      its layout is no DPP output to this rail.
    tm_attestation: >-
      Admits bsv-attestation-anchor-v1 with ten fields, a signature over nine
      length-prefixed fields and a publicly derived anchoring-service key.
      The digest commits to a declared complete secured representation.
      Credential proof, identity, authority and status are separate checks.
    tm_uora_dpp: >-
      Historical and closed to new writes. Serves the uora-anchor-v3 outputs
      already on chain: an output is admitted only when it decodes under
      spec/legacy-uora-anchor-v3.md section 5, its field-8 signature verifies,
      its locking key equals the derived child of the field-7 identity key, and
      that identity key is one the operator names; an index names the
      historical anchoring-service keys it carries and admits nothing else.
  lookupServices:
    ls_dpp: passportLookup
    ls_attestation: anchorLookup
    ls_uora_dpp: legacyAnchorLookup
  must:
    - Serve POST /submit and POST /lookup as upstream defines them.
    - >-
      Serve GET /listTopicManagers, GET /listLookupServiceProviders,
      GET /getDocumentationForTopicManager and
      GET /getDocumentationForLookupServiceProvider, with each DPP topic and
      service returning its admission or query rules as Markdown.
    - >-
      Answer /lookup with the JSON output-list form when x-aggregation is
      absent; the binary aggregated form is optional (see may).
    - >-
      Treat admitting an output already held as a no-op, so re-synchronisation
      and reorganisation replay never duplicate an index entry
      (spec/services.md section 6).
  should:
    - Be reachable over HTTPS; the SDK's mainnet lookup resolver refuses plain HTTP.
    - >-
      Send the X-Admission header on /submit, one outcome per topic, so a
      writer tells an admitted, a duplicate and a refused state apart without
      reading the STEAK.
    - Serve GET /health/live and GET /health/ready for probes.
    - >-
      Accept merkle proofs through POST /arc-ingest, checked to contain the
      transaction and validated against the index's header source before they
      are stored, so a writer or a broadcaster can prove a held state and the
      index serves mined states with their merkle paths (spec/services.md
      section 2).
  may:
    - >-
      Answer /lookup in the binary aggregated form when x-aggregation is yes;
      the SDK resolver requests it by default and falls back on the JSON form
      by content type.
    - >-
      Require a write token on /submit, /arc-ingest and, with the retraction
      extension, /retract: a per-publisher
      token bound to one publisher or anchoring key and one use, accepted only
      for what that key signed (403 token-publisher-mismatch otherwise), or the
      operator-wide token; /lookup and /health stay open.
    - Default an absent X-Topics header to tm_dpp; a portable client always sends it.
    - >-
      Require the acceptance commitment on a version 2 TRANSFER when deployed
      for managed-custody@2 (spec/managed-custody.md section 4), and name the
      control authorities of spec/record-model-v2.md section 6 in the topic
      documentation and the capability document.
  intentionalOmissions:
    - >-
      Lookup outputs carry no context and no txid hint; everything a verifier
      needs is inside the BEEF and the client re-derives the txid.
x-dpp-extensions:
  discovery:
    version: '1'
    summary: >-
      Advertise the topics through SHIP and the lookup services through SLAP
      when the index is public, so a reader who knows only a service name
      finds it (spec/services.md section 1).
  admission-refusal:
    version: '1'
    summary: >-
      The X-Admission-Refusal response header on POST /submit, naming the
      check a refused topic failed. Its codes are informative: x-refusal-codes
      lists the words the reference index sends, which a writer may show and
      branch on, and a client reads any code, listed or not, as a refusal.
  health:
    version: '1'
    summary: GET /health with the topics, services, network and start time the deployment serves.
  capabilities:
    version: '1'
    summary: GET /capabilities, the capability document (contracts/capabilities.schema.json).
  publisher-policy:
    version: '1'
    summary: >-
      GET /publisher-policy, the signed dpp-publisher-policy@1 chain the index
      admits under (contracts/publisher-policy.schema.json), so a reader
      verifies the publisher keys and their windows itself.
  registration:
    version: '1'
    summary: POST /register, self-service registration of a publisher key (spec/services.md section 2).
  retraction:
    version: '1'
    summary: >-
      POST /retract, the withdrawal of a state the network refused after it
      was announced, behind the /submit bearer (spec/services.md section 2).
  gs1-key-lookup:
    version: '1'
    summary: The gs1Key query of ls_dpp, which finds passports by a GS1 key without a host.
  evidence-package:
    version: '1'
    summary: >-
      GET /evidence-package, the dpp-evidence-package@1 for one passport
      (contracts/evidence-package.schema.json, spec/portable-evidence.md
      section 2), signed by the BRC-42 child, for the passport, of the
      exporter identity key the capability document names as
      exporterIdentityKey, and served as a JSON envelope bounded to the newest
      500 states with the rest declared absent. It requires the capabilities
      extension, because the capability document is where a reader finds the
      key it derives each package's signer from.
  sync:
    version: '1'
    summary: >-
      Synchronisation from peers through GASP: the two upstream routes,
      POST /requestSyncResponse and POST /requestForeignGASPNode. The reference
      pulls from the static peers SYNC_PEERS names, judging every offered
      output by the same topic managers as /submit.
paths:
  /submit:
    post:
      summary: Announce a transaction to the index (as upstream, plus the X-Admission and X-Admission-Refusal headers)
      description: >-
        BRC-22, exactly as the upstream contract defines it: a BEEF body, an
        X-Topics header naming the topics that should consider it, an optional
        off-chain values prefix, a STEAK answer. Each topic's manager admits the
        outputs that follow its rules and ignores the rest. Announcing is
        discoverability, never existence: a record that is broadcast but not
        announced is less findable and no less true. What this profile adds is
        below.
      parameters:
        - name: X-Topics
          in: header
          required: false
          schema:
            type: string
          description: >-
            JSON array of topic names, for example ["tm_dpp"] or
            ["tm_attestation"]. Legacy anchors use ["tm_uora_dpp"]. Upstream requires it; this profile lets an index
            default an absent or empty header to tm_dpp, and a portable client
            always sends it. Any other value that is not a JSON array of
            strings is refused.
        - name: X-Includes-Off-Chain-Values
          in: header
          required: false
          schema:
            type: string
            enum: ['true']
          description: As upstream. These topic implementations do not read off-chain values.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: >-
                The transaction in BEEF encoding. A non-genesis passport state
                must carry its predecessor's bytes in the same BEEF, because
                the topic manager holds the transition rules against the
                previous state's locking script, which is a stricter need than
                proof of inclusion. Bodies beyond the deployment's size cap
                (8 MiB in the reference) are refused with 413.
      security:
        - {}
        - bearer: []
      responses:
        '200':
          description: >-
            The STEAK, as upstream. The X-Admission response header summarises
            it per topic, X-Admission-Refusal says why a topic refused it, and
            both are exposed to browser callers.
          headers:
            X-Admission:
              schema:
                type: string
              description: >-
                Comma-separated per-topic outcomes: topic=admitted,
                topic=duplicate or topic=none. A duplicate is told from a
                refusal by whether the topic ran its mutation phase, which the
                STEAK shows as the presence of coinsRemoved.
            X-Admission-Refusal:
              x-dpp-extension: admission-refusal
              schema:
                type: string
              description: >-
                Sent only when a topic refused the transaction (topic=none in
                X-Admission) and its manager recorded why: comma-separated
                topic=code, for example tm_dpp=predecessor-not-admitted. A
                refused topic left out recorded no reason, and an admitted or
                duplicate topic is never named. Codes are lower-case words
                joined by hyphens. The codes are informative: x-refusal-codes
                lists the tm_dpp codes the reference index sends and what each
                asks of the writer, where a verification report names the same
                failure (spec/verification.md section 4) the code is the
                report's own word, and a client reads a code it does not know
                as a refusal without a stated reason.
              x-refusal-codes:
                tm_dpp:
                  decode-failed: 'The transaction carries no well-formed DPP output, or more than one.'
                  actor-signature-invalid: 'The actor signature does not verify against actor_identity_key and actor_keyID.'
                  publisher-not-authorised: 'The server signature is not from a publisher key this index accepts at the state''s own timestamp; GET /capabilities lists the keys.'
                  link-broken: 'A genesis rule or a chain invariant does not hold; checkTransition in @bsv/dpp-protocol names the rule.'
                  lineage-retired: 'The lineage is retired, and nothing follows a RETIRE.'
                  control-not-proven: 'A version 2 UPDATE, TRANSFER or RETIRE does not prove control of the predecessor.'
                  version-transition-invalid: 'The version change is not the one upgrade transition, a version 2 UPDATE that spends a version 1 tip.'
                  acceptance-commitment-absent: 'The index runs the managed custody profile, and the version 2 TRANSFER carries no authorisation_commitment.'
                  genesis-spends-passport-output: 'A genesis state spends a passport output this index admitted.'
                  predecessor-not-admitted: 'The state does not spend the tip this index holds. Announce the predecessor first, oldest state first.'
                  predecessor-unavailable: 'The state spends the tip, but neither the BEEF nor this index holds the predecessor''s bytes. Include them in the BEEF.'
                  lineage-untraceable: 'The lineage genesis of a version 2 state cannot be traced from the history this index holds.'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/namedError'
        '413':
          $ref: '#/components/responses/error'
  /lookup:
    post:
      summary: Query a lookup service (as upstream, with the declared query shapes)
      description: >-
        BRC-24, exactly as the upstream contract defines it. The body names a
        lookup service and passes it a query; the answer is an output list as
        BEEF so the caller verifies everything against block headers, and a
        compromised index changes what can be found, never what can be
        believed. This profile fixes the query shapes and the answer
        bounds; whether the binary aggregated answer is served is the index's
        choice (x-dpp-profile).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/passportLookup'
                - $ref: '#/components/schemas/anchorLookup'
                - $ref: '#/components/schemas/legacyAnchorLookup'
      responses:
        '200':
          description: >-
            The matching outputs, as the upstream LookupAnswer. A DPP index
            omits the optional context and txid hint on each output.
          content:
            application/json:
              schema:
                type: object
                required: [type, outputs]
                properties:
                  type:
                    const: output-list
                  outputs:
                    type: array
                    items:
                      type: object
                      required: [beef, outputIndex]
                      properties:
                        beef:
                          type: array
                          items:
                            type: integer
                          description: The transaction in BEEF encoding, as bytes.
                        outputIndex:
                          type: integer
        '400':
          $ref: '#/components/responses/error'
  /arc-ingest:
    post:
      summary: Push a merkle proof for a state this index holds (as upstream, plus verification before storage)
      description: >-
        The body is the shape an ARC-compatible broadcaster's callback carries,
        so a writer offering a proof (spec/writing.md section 7) and a
        broadcaster whose callback URL points here send the same thing. What
        this profile adds is spec/services.md section 2: the proof must contain
        the transaction and must validate against the index's header source
        before it is stored (400 otherwise); a proof the header source cannot
        evaluate is neither applied nor refused (503, try again); a callback
        that carries no merkle path is acknowledged and ignored (200, status
        ignored) so a broadcaster does not retry it; a transaction this index
        does not hold answers 404; and when the deployment configures a
        callback token it is required as a bearer or as X-Callback-Token (401
        otherwise).
      security:
        - bearer: []
        - callbackToken: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txid]
              properties:
                txid:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                merklePath:
                  type: [string, 'null']
                  description: The BRC-74 BUMP in hex. Absent or null on a status-only callback.
                blockHeight:
                  type: integer
                  description: When present, must equal the height the BUMP carries.
      responses:
        '200':
          description: Applied, or acknowledged and ignored when no merkle path was sent.
          content:
            application/json:
              schema:
                type: object
                required: [status, txid]
                properties:
                  status:
                    enum: [applied, ignored]
                  txid:
                    type: string
                  blockHeight:
                    type: integer
                  reason:
                    type: string
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/namedError'
        '404':
          $ref: '#/components/responses/error'
        '503':
          $ref: '#/components/responses/error'
  /getDocumentationForTopicManager:
    get:
      summary: As upstream; Passport, current attestation and legacy topics return their admission rules as Markdown
      parameters:
        - name: manager
          in: query
          required: true
          schema:
            type: string
            enum: [tm_dpp, tm_attestation, tm_uora_dpp]
      responses:
        '200':
          description: Markdown.
          content:
            text/markdown:
              schema:
                type: string
  /getDocumentationForLookupServiceProvider:
    get:
      summary: As upstream; Passport, current attestation and legacy services return their query rules as Markdown
      parameters:
        - name: lookupService
          in: query
          required: true
          schema:
            type: string
            enum: [ls_dpp, ls_attestation, ls_uora_dpp]
      responses:
        '200':
          description: Markdown.
          content:
            text/markdown:
              schema:
                type: string
  /health:
    get:
      x-dpp-extension: health
      summary: As upstream, plus what this deployment serves
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                  topic:
                    type: string
                    description: >-
                      The passport-rail topic, singular. The first
                      deployment's health probes read the two singular
                      fields, and a second rail is not a reason to break a
                      probe; the full sets are beside them.
                  service:
                    type: string
                    description: The passport-rail lookup service, singular.
                  topics:
                    type: array
                    items:
                      type: string
                  services:
                    type: array
                    items:
                      type: string
                  legacyTopics:
                    type: array
                    items: { type: string }
                  legacyServices:
                    type: array
                    items: { type: string }
                  network:
                    type: string
                  startedAt:
                    type: string
                    format: date-time
  /capabilities:
    get:
      x-dpp-extension: capabilities
      summary: The capability document of this deployment (an extension; spec/conformance.md section 4)
      description: >-
        What this node declares it supports, in the shape
        contracts/capabilities.schema.json fixes: its roles, the wire versions
        it speaks (read from the same constants the wire is built from), the
        operator profile it runs under, the representations it indexes
        commitments to, the anchor formats it admits, remembers and refuses,
        its topics and services, the publisher key policy in force (the keys
        active at the moment of the request), the custody profile with its
        control authorities, its synchronisation profile, its limits and, by
        name, what it does not do. A claim of support, checkable against the
        conformance ledger; never proof of authority or of conformance. Without
        a publisher policy file the document reports the single configured
        identity key as an implicit single-operator policy with no rotation
        history, and says so under unsupported. With the evidence-package
        extension it names, as exporterIdentityKey, the identity key whose
        BRC-42 child signs each package.
      responses:
        '200':
          description: The capability document, as of the moment of the request.
          content:
            application/json:
              schema:
                $ref: './capabilities.schema.json'
  /publisher-policy:
    get:
      x-dpp-extension: publisher-policy
      summary: The signed publisher policy chain this index admits under (an extension; spec/services.md section 1)
      description: >-
        The dpp-publisher-policy@1 chain, oldest first, as the index verified
        it at boot and, where it registers publishers, with every version
        appended since, verified as an extension of the chain before it is
        served. GET /capabilities lists only the keys active now,
        without their windows and without signatures; this is the chain a
        reader checks with verifyPolicyChain from @bsv/dpp-protocol, against
        operator identity keys it obtained from the operator and never from
        this index, before taking the keys and windows it names. An index that
        admits under one configured identity key has no chain and answers 404
        with code no-publisher-policy.
      responses:
        '200':
          description: The chain, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './publisher-policy.schema.json'
        '404':
          $ref: '#/components/responses/error'
  /evidence-package:
    get:
      x-dpp-extension: evidence-package
      summary: The evidence package for one passport (an extension; spec/portable-evidence.md section 2)
      description: >-
        Everything this index holds about the passport, as a
        dpp-evidence-package@1: every retained state's raw transaction under
        transactions/, the BEEF it is held in under proofs/ (the merkle path
        and ancestors a verifier needs, once a proof has reached /arc-ingest),
        the publisher policy chain under authority/ when one is configured,
        this index's spend observations under status/, and a verification
        report in the shape of spec/verification.md under reports/, inventoried
        by path, media type, length and SHA-256 in a manifest that names the
        exporter identity key the capability document gives as
        exporterIdentityKey and is signed by that key's BRC-42 child for
        [1, "dpp evidence package v1"], the passport identifier as key
        identifier and counterparty anyone, which a reader derives from the
        identity key (spec/portable-evidence.md section 2). The standard
        leaves the archive form to the
        build; this build's is a JSON envelope, the manifest beside a map of
        every inventoried file to its base64 bytes, so a browser or a script
        reads it without an archive library and the map is exactly what a
        reader's inspection takes. The disclosure scope is public and the
        package is never a recovery backup: the restricted tiers are not held
        here and are withheld by name, and any state whose transaction or proof
        could not be produced is declared absent, never implied present. The
        completeness declaration names the snapshot the export read. The
        signature says this index assembled these
        bytes and nothing more; a reader verifies every transaction, proof and
        signature independently.
      parameters:
        - name: passportId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The package.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/evidencePackageEnvelope'
        '400':
          $ref: '#/components/responses/namedError'
        '404':
          $ref: '#/components/responses/namedError'
        '503':
          description: The deployment configures no exporter identity key to sign with (error export-unavailable), so no package is signed; the bounded lookup remains.
          content:
            application/json:
              schema:
                $ref: '#/components/responses/namedError/content/application~1json/schema'
  /retract:
    post:
      x-dpp-extension: retraction
      summary: Withdraw a state the network refused after it was announced (an extension)
      description: >-
        A writer may announce a state before sending it (spec/writing.md), so
        an index can hold an output no block will ever contain; that phantom
        sits on the passport as its tip until the writer, who alone knows the
        network's answer, withdraws it. Behind the same bearer as /submit,
        because whoever may add a state may withdraw one. Refused with 409
        retraction-refused when the index holds a merkle path for the output,
        when the configured header source's operator knows the transaction, or
        when the output is spent, since a history is never cut in the middle;
        answered 503 chain-tracker-unavailable, and not applied, when the
        network could not be asked. Otherwise the output leaves the engine's
        storage and the record stores as an eviction removes it, the
        predecessor is the tip again, the transaction may be announced again
        should the network take it after all, and the retraction is logged
        with its reason. A deployment without a header source
        (CHAIN_TRACKER=scripts-only) cannot ask the network; the answer then
        carries networkChecked false and a note saying so, and the capability
        document lists retraction-network-check as unsupported. A retraction
        is local to this index: synchronisation carries admissions only, so a
        peer that pulled the output keeps it until that peer's operator
        withdraws it through its own retraction route (spec/services.md
        section 2).
      security:
        - {}
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/retractionRequest'
      responses:
        '200':
          description: Retracted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/retraction'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/namedError'
        '404':
          $ref: '#/components/responses/namedError'
        '409':
          $ref: '#/components/responses/namedError'
        '503':
          $ref: '#/components/responses/namedError'
  /register:
    post:
      x-dpp-extension: registration
      summary: Register a publisher key with this index, from the application's own wallet (an extension; spec/services.md section 2)
      description: >-
        Self-service registration, where the operator enables it with
        REGISTRATION=open or REGISTRATION=approval. The body is a
        dpp-index-registration@1 request the application's wallet signed with
        the BRC-42 child of its publisher key for protocol
        [1, "dpp index registration v1"], key identifier the index URL and
        counterparty anyone, so the index verifies it from the request alone
        and a request signed for another index fails here. The index checks
        the signature, then that the request names this index's address, its
        network and the custody profile its capability document declares, and
        that requestedAt is within ten minutes of its clock. In open mode the
        operator's identity key then signs a new policy version naming the key
        as a state publisher, a rotation under spec/services.md section 1 that
        GET /publisher-policy serves at once and the topic managers admit under
        at once, and the answer carries the key's two write tokens, shown once.
        Under approval the request is held as pending (202) until the operator
        approves it on the command line; the application then re-sends a
        freshly signed request and collects its tokens (201), once. A key
        registers once: a later request is 409 already-registered, and a key
        the operator refused or revoked is told so with 403. The answer never
        carries the operator's key; the appended version is read from
        GET /publisher-policy. Rate limited per source address, 429 past the
        limit; 404 registration-unavailable where the index does not register
        publishers, 503 registration-unavailable when its policy version is
        full.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './index-registration.schema.json'
      responses:
        '201':
          description: Registered, with the key's write tokens, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [status, policyVersion, tokens]
                properties:
                  status:
                    const: registered
                  policyVersion:
                    type: integer
                    minimum: 2
                    description: The policy version that names the key, served by GET /publisher-policy.
                  tokens:
                    type: object
                    required: [submit, callback]
                    properties:
                      submit:
                        type: string
                        pattern: '^[0-9a-f]{64}$'
                        description: The bearer for POST /submit and POST /retract.
                      callback:
                        type: string
                        pattern: '^[0-9a-f]{64}$'
                        description: The token for POST /arc-ingest, as the bearer or X-Callback-Token.
        '202':
          description: Held for the operator's approval; re-send a freshly signed request later.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: pending
        '400':
          $ref: '#/components/responses/namedError'
        '401':
          $ref: '#/components/responses/namedError'
        '403':
          $ref: '#/components/responses/namedError'
        '404':
          $ref: '#/components/responses/namedError'
        '409':
          $ref: '#/components/responses/namedError'
        '413':
          $ref: '#/components/responses/error'
        '429':
          $ref: '#/components/responses/namedError'
        '503':
          $ref: '#/components/responses/namedError'
  /requestSyncResponse:
    post:
      x-dpp-extension: sync
      summary: The outputs this index holds for a topic since a checkpoint, for a synchronising peer (as upstream)
      description: >-
        The first half of GASP, exactly as the upstream overlay protocol
        defines it: the body is the SDK's GASPInitialRequest (version, since,
        optional limit) and the topic comes from the X-BSV-Topic header. The
        answer lists the unspent outputs the index holds for the topic with a
        score at or above since, and echoes since. Read-only and open, like
        /lookup: what it lists is findable either way. Bodies beyond the
        deployment's size cap are refused with 413; a missing or unknown topic
        and a malformed request answer 400 in the shape the other POST routes
        use. The page is bounded to 500 outputs, the request's limit defaulting
        to that and clamped to it, because the engine's storage applies no cap
        of its own; a peer holding more continues from its checkpoint on its
        next round. A peer admits what it fetches through its own topic
        managers, so nothing listed here is trusted by being listed.
      parameters:
        - name: X-BSV-Topic
          in: header
          required: true
          schema:
            type: string
            enum: [tm_dpp, tm_attestation, tm_uora_dpp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, since]
              properties:
                version:
                  type: number
                  description: The requester's GASP version.
                since:
                  type: integer
                  minimum: 0
                  description: The score of the requester's last interaction with this index for the topic; 0 asks for everything.
                limit:
                  type: integer
                  minimum: 1
                  default: 500
                  description: Outputs per answer; absent defaults to 500 and any larger value is clamped to 500.
      responses:
        '200':
          description: The outputs, with their scores, at most 500.
          content:
            application/json:
              schema:
                type: object
                required: [UTXOList, since]
                properties:
                  UTXOList:
                    type: array
                    items:
                      type: object
                      required: [txid, outputIndex, score]
                      properties:
                        txid:
                          type: string
                          pattern: '^[0-9a-f]{64}$'
                        outputIndex:
                          type: integer
                        score:
                          type: number
                  since:
                    type: integer
        '400':
          $ref: '#/components/responses/error'
        '413':
          $ref: '#/components/responses/error'
  /requestForeignGASPNode:
    post:
      x-dpp-extension: sync
      summary: One transaction of a graph a synchronising peer is assembling, with its proof when held (as upstream)
      description: >-
        The second half of GASP, exactly as upstream: graphID is the outpoint
        at the tip of the graph as txid.outputIndex, txid names the
        transaction wanted from somewhere in that output's history, and the
        answer carries the raw transaction and, when this index holds one, the
        BRC-74 merkle path as proof. A transaction the index cannot find in
        that graph answers 404; a malformed request answers 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graphID, txid, outputIndex]
              properties:
                graphID:
                  type: string
                  pattern: '^[0-9a-f]{64}\\.[0-9]+$'
                txid:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                outputIndex:
                  type: integer
                  minimum: 0
                metadata:
                  type: boolean
                  description: As upstream; these topics carry no metadata and the flag is ignored.
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema:
                type: object
                required: [graphID, rawTx, outputIndex]
                properties:
                  graphID:
                    type: string
                  rawTx:
                    type: string
                    description: The transaction in hex.
                  outputIndex:
                    type: integer
                  proof:
                    type: string
                    description: The BRC-74 BUMP in hex, when this index holds a merkle path for the transaction.
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
        '413':
          $ref: '#/components/responses/error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        Required on /submit, /retract and /arc-ingest when the
        deployment configures tokens. A write token belongs to one publisher
        or anchoring key and one use, submit (for /submit and /retract) or
        callback (for /arc-ingest): the index accepts it only for a state that
        key countersigned or an anchor naming that key as its anchoring
        service, and answers 403 token-publisher-mismatch otherwise, 401 for an
        unknown, revoked or wrong-use token. A deployment may keep one
        operator-wide token per route beside them.
    callbackToken:
      type: apiKey
      in: header
      name: X-Callback-Token
      description: The other carrier of the /arc-ingest token, as the upstream host reads it.
  responses:
    error:
      description: The request was refused.
      content:
        application/json:
          schema:
            type: object
            required: [status, description]
            properties:
              status:
                const: error
              description:
                type: string
    namedError:
      description: The request was refused, for a reason the client can branch on.
      content:
        application/json:
          schema:
            type: object
            required: [status, error, description]
            properties:
              status:
                const: error
              error:
                type: string
                description: >-
                  The refusal as one lower-case hyphenated word: query-invalid,
                  export-unavailable,
                  passport-unknown, output-unknown, retraction-refused,
                  chain-tracker-unavailable, retraction-unavailable,
                  token-publisher-mismatch, or on POST /register
                  registration-unavailable, registration-rate-limited,
                  registration-malformed, registration-signature-invalid,
                  index-url-mismatch, network-mismatch,
                  custody-profile-mismatch, request-stale,
                  already-registered, registration-refused or
                  registration-revoked.
              description:
                type: string
              hint:
                type: string
                description: What to do instead, when there is something to do.
  schemas:
    passportLookup:
      type: object
      required: [service, query]
      description: >-
        The passport rail. Resolves a record's chain by its passport identifier,
        by its data-carrier identifier or, with the gs1-key-lookup extension,
        by its GS1 key. At least one must be provided; the service refuses an
        empty query. The answer holds the tip
        and every retained earlier state, bounded to 500 outputs with the
        newest kept, so a truncated history fails verification rather than
        presenting a stale tip.
      properties:
        service:
          const: ls_dpp
        query:
          type: object
          properties:
            passportId:
              type: string
            uid:
              type: string
              description: The data-carrier identifier carried in the record's public payload.
            gs1Key:
              x-dpp-extension: gs1-key-lookup
              type: string
              description: >-
                A GS1 key without a host, for a caller holding a GTIN and serial
                but not the host a passport was issued under: the key tuple of
                spec/gs1-discovery.md section 1 (01:09529990001039|21:SERIAL),
                a Digital Link path (01/09529990001039/21/SERIAL) or a whole
                Digital Link URI under any host. The answer holds the states of
                every passport whose identifier names that key, each under its
                own exact identifier, which the caller verifies as it would any
                lookup's answer. A shared key is not evidence that a passport
                concerns the caller's product (spec/gs1-discovery.md section 1).
                A value that names no GS1 key is refused.
    legacyAnchorLookup:
      type: object
      required: [service, query]
      description: >-
        The anchor rail. At least one identifying selector must be provided
        (issuer, issuerKey, subject, attestationId, digest or anchoredBy); the
        service refuses a query carrying none, so the index cannot be asked to
        enumerate itself. uoraType refines a selected set and cannot select on
        its own; limit pages the answer, which is bounded to 500 whatever is
        asked for. Selectors combine as AND. The issuer selectors answer the
        question the rail exists for, everything one party has attested; the
        subject selector answers everything claimed about one passport, from
        every party.
      properties:
        service:
          const: ls_uora_dpp
        query:
          type: object
          properties:
            issuer:
              type: string
              description: The claiming party, as the did:key the anchor carries.
            issuerKey:
              type: string
              description: The claiming party's compressed public key, hex.
            subject:
              type: string
              description: The passport identifier the claim is about.
            attestationId:
              type: string
            digest:
              type: string
              description: The 64-hex-character digest, for an exact-anchor question.
            uoraType:
              type: string
            anchoredBy:
              type: string
              description: The anchoring service's identity key, hex.
            limit:
              type: number

    anchorLookup:
      type: object
      additionalProperties: false
      required: [service, query]
      properties:
        service:
          const: ls_attestation
        query:
          type: object
          additionalProperties: false
          description: >-
            Exact signed metadata selectors, with at least one identifying selector.
            Results sort by txid then outputIndex. Continue with after equal to the
            final returned outpoint until an empty page. The index is observed live,
            not as a guaranteed snapshot. String bounds are UTF-8 byte bounds.
          anyOf:
            - required: [issuer]
            - required: [subject]
            - required: [attestationId]
            - required: [digest]
            - required: [anchoredBy]
          properties:
            issuer: { type: string, minLength: 1, maxLength: 512 }
            subject: { type: string, minLength: 1, maxLength: 512 }
            attestationId: { type: string, minLength: 1, maxLength: 512 }
            digest: { type: string, minLength: 1, maxLength: 512 }
            anchoredBy: { type: string, minLength: 1, maxLength: 512 }
            attestationType: { type: string, minLength: 1, maxLength: 512 }
            representation: { type: string, minLength: 1, maxLength: 512 }
            mediaType: { type: string, minLength: 1, maxLength: 512 }
            limit: { type: integer, minimum: 1, maximum: 500, default: 100 }
            after:
              type: object
              additionalProperties: false
              required: [txid, outputIndex]
              properties:
                txid: { type: string, pattern: '^[0-9a-f]{64}$' }
                outputIndex: { type: integer, minimum: 0, maximum: 9007199254740991 }
    evidencePackageEnvelope:
      type: object
      required: [manifest, files]
      description: >-
        The archive form of this build's dpp-evidence-package@1: the signed
        manifest beside every inventoried file, keyed by its inventory path.
        The manifest's inventory names each file's category, media type,
        length and SHA-256; the map holds nothing the inventory does not list.
      properties:
        manifest:
          $ref: './evidence-package.schema.json'
        files:
          type: object
          additionalProperties:
            type: string
            contentEncoding: base64
          description: Every inventoried file, base64, by its inventory path.
    retractionRequest:
      type: object
      required: [txid, outputIndex, reason]
      properties:
        txid:
          type: string
          pattern: '^[0-9a-f]{64}$'
        outputIndex:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: The writer's account of the network's answer, logged and echoed, never interpreted.
    retraction:
      type: object
      required: [status, txid, outputIndex, reason, networkChecked, unrepaired]
      properties:
        status:
          const: retracted
        txid:
          type: string
        outputIndex:
          type: integer
        reason:
          type: string
        networkChecked:
          type: boolean
          description: Whether the header source's operator was asked about the transaction; false under CHAIN_TRACKER=scripts-only.
        restoredTip:
          type: object
          required: [txid, outputIndex]
          properties:
            txid:
              type: string
            outputIndex:
              type: integer
          description: The predecessor made the tip again, when the retracted state had one.
        unrepaired:
          type: array
          items:
            type: string
          description: Repairs the engine storage could not make, by name; empty for this package's own storages.
        note:
          type: string
          description: Present when the network was not asked, saying why.
