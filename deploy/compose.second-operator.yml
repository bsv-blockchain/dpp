# A second, independently administered operator: its own MongoDB, its own
# identity, its own tokens and its own export key, synchronising from the
# first through GASP and admitting every offered output through the same
# topic managers as its own /submit. Run beside deploy/compose.yml with a
# second env file, or on another host entirely, which is what independence
# means; on one host it proves the mechanism and nothing more
# (packages/overlay-topics/README.md, Running two operators locally).
#
#   docker compose -f deploy/compose.second-operator.yml --env-file deploy/operator-b.env up -d
name: dpp-overlay-b

services:
  mongo-b:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo-b-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  overlay-b:
    image: ${OVERLAY_IMAGE:-dpp-overlay:local}
    restart: unless-stopped
    depends_on:
      mongo-b:
        condition: service_healthy
    ports:
      - "${OVERLAY_PORT:-8081}:8080"
    environment:
      PORT: "8080"
      MONGO_URL: mongodb://mongo-b:27017
      MONGO_DB: ${MONGO_DB:-dpp}
      NETWORK: ${NETWORK:-main}
      SERVICE_IDENTITY_KEY: ${SERVICE_IDENTITY_KEY:-}
      SERVER_PRIVATE_KEY: ${SERVER_PRIVATE_KEY:-}
      SUBMIT_TOKEN: ${SUBMIT_TOKEN:?set SUBMIT_TOKEN in the env file}
      ARC_CALLBACK_TOKEN: ${ARC_CALLBACK_TOKEN:?set ARC_CALLBACK_TOKEN in the env file}
      CHAIN_TRACKER: ${CHAIN_TRACKER:-}
      WOC_API_KEY: ${WOC_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ANCHOR_SERVICE_KEYS: ${ANCHOR_SERVICE_KEYS:-}
      OWNER_CONSENT: ${OWNER_CONSENT:-}
      TRANSFER_AUTHORITIES: ${TRANSFER_AUTHORITIES:-}
      ACCEPTANCE_COMMITMENT: ${ACCEPTANCE_COMMITMENT:-}
      CONTROL_AUTHORITIES: ${CONTROL_AUTHORITIES:-}
      PUBLISHER_POLICY_FILE: ${PUBLISHER_POLICY_FILE:-}
      OPERATOR_IDENTITY_KEYS: ${OPERATOR_IDENTITY_KEYS:-}
      EXPORT_SIGNING_KEY: ${EXPORT_SIGNING_KEY:-}
      # The first operator's base URL as this container reaches it; on one
      # host with the default compose network names, http://host.docker.internal:8080.
      SYNC_PEERS: ${SYNC_PEERS:?set SYNC_PEERS to the first operator's base URL}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-60000}
      SYNC_LEGACY: ${SYNC_LEGACY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config:ro

volumes:
  mongo-b-data:
