# A second, independently administered operator: its own MongoDB, its own
# identity, its own tokens and its own exporter key, synchronising from the
# first through GASP and admitting every offered output through the same
# topic managers as its own /submit. Run beside deploy/compose.yml with a
# second env file, or on another host entirely, which is what independence
# means; on one host it proves the mechanism and nothing more
# (packages/dpp-overlay/README.md, Running two operators locally).
#
#   docker compose -f deploy/compose.second-operator.yml --env-file deploy/operator-b.env up -d
#
# Both images are named by digest, exactly as in deploy/compose.yml: the index
# through DPP_IMAGE_REGISTRY and OVERLAY_IMAGE_DIGEST, which the env file
# sets from the release set and which take no tag, and MongoDB by tag and
# digest. To run the index built from a source checkout instead, add
# deploy/compose.second-operator.build.yml and deploy/build.env
# (deploy/README.md, Build from source). This file runs no validator service:
# the first operator's preset has it.
name: dpp-overlay-b

services:
  mongo-b:
    image: mongo:7.0.48@sha256:9896df581dfd0718b7abe112f4c37598d0986c54060e4ec1384997e6503c8c71
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo-b-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  overlay-b:
    image: ${DPP_IMAGE_REGISTRY:?set DPP_IMAGE_REGISTRY to the registry of this release set's images}/dpp-overlay@${OVERLAY_IMAGE_DIGEST:?set OVERLAY_IMAGE_DIGEST to the sha256 digest of the published dpp-overlay image. A tag is not accepted. To build from source see deploy/README.md}
    restart: unless-stopped
    depends_on:
      mongo-b:
        condition: service_healthy
    ports:
      - "${OVERLAY_PORT:-8081}:8080"
    environment:
      PORT: "8080"
      MONGO_URL: mongodb://mongo-b:27017
      MONGO_DB: ${MONGO_DB:-dpp}
      NETWORK: ${NETWORK:-main}
      SERVICE_IDENTITY_KEY: ${SERVICE_IDENTITY_KEY:-}
      SERVER_PRIVATE_KEY: ${SERVER_PRIVATE_KEY:-}
      SUBMIT_TOKEN: ${SUBMIT_TOKEN:?set SUBMIT_TOKEN in the env file}
      ARC_CALLBACK_TOKEN: ${ARC_CALLBACK_TOKEN:?set ARC_CALLBACK_TOKEN in the env file}
      CHAIN_TRACKER: ${CHAIN_TRACKER:-}
      WOC_API_KEY: ${WOC_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ANCHOR_SERVICE_KEYS: ${ANCHOR_SERVICE_KEYS:-}
      ACCEPTANCE_COMMITMENT: ${ACCEPTANCE_COMMITMENT:-}
      CONTROL_AUTHORITIES: ${CONTROL_AUTHORITIES:-}
      # Settings this release no longer reads, forwarded so that the node
      # refuses to boot with one set instead of silently dropping its rule.
      OWNER_CONSENT: ${OWNER_CONSENT:-}
      TRANSFER_AUTHORITIES: ${TRANSFER_AUTHORITIES:-}
      INSTRUCTION_COMMITMENT: ${INSTRUCTION_COMMITMENT:-}
      EXPORT_SIGNING_KEY: ${EXPORT_SIGNING_KEY:-}
      PUBLISHER_POLICY_FILE: ${PUBLISHER_POLICY_FILE:-}
      PUBLISHER_POLICY_JSON: ${PUBLISHER_POLICY_JSON:-}
      OPERATOR_IDENTITY_KEYS: ${OPERATOR_IDENTITY_KEYS:-}
      # The exporter's identity key: its child for each passport signs that passport's evidence packages.
      EXPORTER_PRIVATE_KEY: ${EXPORTER_PRIVATE_KEY:-}
      EXPORT_TOKEN: ${EXPORT_TOKEN:-}
      # The first operator's public HTTPS base URL.
      SYNC_PEERS: ${SYNC_PEERS:?set SYNC_PEERS to the first operator's base URL}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-60000}
      SYNC_LEGACY: ${SYNC_LEGACY:-}
    volumes:
      - ./config:/config:ro

volumes:
  mongo-b-data:
