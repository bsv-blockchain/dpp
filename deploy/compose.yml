# The reference index node with persistent storage: one MongoDB, one node,
# both data and configuration on named volumes and an env file, so a restart
# or a host move keeps every admitted state. The image is this repository's
# (packages/dpp-overlay/Dockerfile), built from the repository root. This is
# the operator preset: everything an index operator runs, with the
# application's connection file issued by the node's own command line.
#
#   cp deploy/operator.env.example deploy/operator.env   # then fill it in
#   docker compose -f deploy/compose.yml --env-file deploy/operator.env up -d --build
#   docker compose -f deploy/compose.yml --env-file deploy/operator.env exec -T overlay \
#     node packages/dpp-overlay/dist/cli.js connection > deploy/app.env
#
# What the node does and does not do is unchanged from running it by hand:
# it admits and serves, it does not broadcast, proofs reach it through
# POST /arc-ingest, and CHAIN_TRACKER=scripts-only is a local fixture setting
# that claims no inclusion (packages/dpp-overlay/README.md, Configuration).
# deploy/README.md is the recipe, including the second operator.
name: dpp-overlay

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  overlay:
    build:
      context: ..
      dockerfile: packages/dpp-overlay/Dockerfile
    image: ${OVERLAY_IMAGE:-dpp-overlay:local}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # The node keeps nothing on disk (MongoDB holds everything admitted and the
    # policy mount is read-only), so it runs as the image's unprivileged node
    # user on a read-only filesystem with no capabilities, under an init that
    # passes the stop signal on, with time for the graceful shutdown to finish
    # its writes.
    user: node
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    ports:
      - "${OVERLAY_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      # The bundled MongoDB, reachable only on this Compose network. Set
      # MONGO_URL to a managed database's authenticated URI instead; the
      # bundled one then holds nothing.
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-dpp}
      NETWORK: ${NETWORK:-main}
      # One of the two identity settings is required; the public key is the
      # one to set, the node never needs the private half.
      SERVICE_IDENTITY_KEY: ${SERVICE_IDENTITY_KEY:-}
      SERVER_PRIVATE_KEY: ${SERVER_PRIVATE_KEY:-}
      # Write access is per publisher: tokens bound to one key and one use,
      # hashed in this MongoDB and issued with dpp-index connection or
      # dpp-index tokens issue. Until one is issued every write is refused.
      # The two operator-wide tokens are optional, accepted for any publisher.
      SUBMIT_TOKEN: ${SUBMIT_TOKEN:-}
      ARC_CALLBACK_TOKEN: ${ARC_CALLBACK_TOKEN:-}
      PUBLISHER_TOKENS_FILE: ${PUBLISHER_TOKENS_FILE:-}
      REGISTRATION: ${REGISTRATION:-}
      OPERATOR_SIGNING_KEY: ${OPERATOR_SIGNING_KEY:-}
      REGISTRATION_RATE_LIMIT: ${REGISTRATION_RATE_LIMIT:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CHAIN_TRACKER: ${CHAIN_TRACKER:-}
      WOC_API_KEY: ${WOC_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ANCHOR_SERVICE_KEYS: ${ANCHOR_SERVICE_KEYS:-}
      OWNER_CONSENT: ${OWNER_CONSENT:-}
      TRANSFER_AUTHORITIES: ${TRANSFER_AUTHORITIES:-}
      ACCEPTANCE_COMMITMENT: ${ACCEPTANCE_COMMITMENT:-}
      INSTRUCTION_COMMITMENT: ${INSTRUCTION_COMMITMENT:-}
      CONTROL_AUTHORITIES: ${CONTROL_AUTHORITIES:-}
      PUBLISHER_POLICY_FILE: ${PUBLISHER_POLICY_FILE:-}
      PUBLISHER_POLICY_JSON: ${PUBLISHER_POLICY_JSON:-}
      OPERATOR_IDENTITY_KEYS: ${OPERATOR_IDENTITY_KEYS:-}
      EXPORT_SIGNING_KEY: ${EXPORT_SIGNING_KEY:-}
      # The bearer for GET /evidence-export, the complete export; the bounded
      # GET /evidence-package and GET /history stay open. Forwarded here
      # because an env-file value reaches the container only through this list.
      EXPORT_TOKEN: ${EXPORT_TOKEN:-}
      SYNC_PEERS: ${SYNC_PEERS:-}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-}
      SYNC_LEGACY: ${SYNC_LEGACY:-}
      SYNC_DISCOVERY: ${SYNC_DISCOVERY:-}
      SLAP_TRACKERS: ${SLAP_TRACKERS:-}
      SYNC_MAX_DISCOVERED: ${SYNC_MAX_DISCOVERED:-}
      # Optional SHIP/SLAP advertising, funded by a separate wallet.
      ADVERTISE: ${ADVERTISE:-}
      ADVERTISER_PRIVATE_KEY: ${ADVERTISER_PRIVATE_KEY:-}
      ADVERTISER_STORAGE_URL: ${ADVERTISER_STORAGE_URL:-}
    volumes:
      # The publisher policy chain, when PUBLISHER_POLICY_FILE names one under /config.
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  mongo-data:
