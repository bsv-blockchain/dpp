# GitBook Git Sync configuration. The synchronised documentation root is
# docs/ and nothing else: the normative material under spec/, contracts/ and
# fixtures/ stays canonical in Git and is linked from the pages by pinned
# repository URL, never copied. docs/README.md is the site's entry page and
# docs/SUMMARY.md its navigation. Connecting a space to this file is a
# separately approved action; the configuration is prepared here so the
# connection changes nothing about the content.
root: ./docs/
structure:
  readme: README.md
  summary: SUMMARY.md
