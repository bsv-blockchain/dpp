# The packages and the fixtures, on every change: build, typecheck, the workspace
# test suites (which include the fixture-consistency checks holding
# fixtures/*.json identical to their source modules), and the index image, so
# a change that breaks the deployable artefact is caught here rather than at a
# deployment.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: node examples/verify-passport.mjs --fixture
      - run: node examples/verify-passport.mjs --fixture --owner-consent
      - run: node examples/verify-passport.mjs --fixture --report
      - run: node examples/verify-passport.mjs --fixture --version=2
      - run: node examples/verify-passport.mjs --fixture --version=2 --report
      - run: node examples/lifecycle-v2.mjs
      - run: node examples/write-passport.mjs --dry-run
      - run: node examples/write-passport-v2.mjs --dry-run
      - run: node examples/sign-publisher-policy.mjs --dry-run
      - run: node examples/sample-payload.mjs --all
      - run: node examples/verify-anchor.mjs
      - run: node examples/verify-attestation-anchor.mjs
      - run: node examples/check-registry.mjs --fixture
      # The interoperability profiles, each from the built packages alone.
      - run: node examples/resolve-digital-link.mjs
      - run: node examples/import-epcis.mjs
      - run: node examples/verify-external-credential.mjs
      - run: node examples/project-passport.mjs
      - run: python3 conformance/independent/python/dpp_verify.py
      # The documentation site: navigation, links, pinned repository paths,
      # example commands, version references and the two generated pages.
      - run: node scripts/docs-check.mjs

  # The clean consumer: the packed candidates installed into a project outside
  # this checkout, development dependencies omitted, every entry point imported
  # and type-checked, the reader path run on the fixtures.
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/release-candidates.mjs
      - run: node scripts/consumer-check.mjs
      - run: npm run index-starter:check
      # The implementer bundle assembles from the same tree, so a file it
      # would refuse to carry is caught here.
      - run: node scripts/implementer-bundle.mjs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The base image comes from the Docker Official Images mirror on Amazon
      # ECR Public, which serves the same digests as Docker Hub, so a Docker
      # Hub rate limit or outage cannot fail this job; the Dockerfile default
      # stays node:22-slim for platform and local builds.
      - run: docker build --build-arg BASE_IMAGE=public.ecr.aws/docker/library/node:22-slim -f packages/overlay-topics/Dockerfile -t dpp-overlay:ci .
      # A versioned smoke of the image: it boots on configuration alone,
      # answers /health and names its capabilities.
      - run: |
          set -euo pipefail
          docker run -d --name smoke -p 18080:8080 \
            -e SERVICE_IDENTITY_KEY=02466d7fcae563e5cb09a0d1870bb580344804617879a14949cf22285f1bae3f27 \
            -e SUBMIT_TOKEN=smoke -e ARC_CALLBACK_TOKEN=smoke -e CHAIN_TRACKER=scripts-only \
            dpp-overlay:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/capabilities | head -c 400
          docker rm -f smoke

  # The starter: @bsv/create-dpp-app scaffolds an application from its bundled
  # template, pinned to the current release set. The CLI builds and tests,
  # then a scaffold in a temporary directory installs packed runtime candidates,
  # typechecks, builds and runs the template's offline lifecycle test, on the
  # oldest supported Node and the current LTS.
  starter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -w @bsv/create-dpp-app
      - run: npm run starter:check

  # The scaffolded application's image builds and its API answers /api/health.
  starter-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run starter:check -- --prepare-only --directory /tmp/my-dpp
      - run: docker build -f /tmp/my-dpp/.candidate.Dockerfile -t my-dpp /tmp/my-dpp
      - run: |
          set -euo pipefail
          docker run -d --name app -p 3000:3000 -e MONGO_URL=mongodb://127.0.0.1:1 -e PASSPORT_HOST=localhost:3000 my-dpp
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          docker rm -f app
