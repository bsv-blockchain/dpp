# The packages and the fixtures, on every change: build, typecheck, the workspace
# test suites (which include the fixture-consistency checks holding
# fixtures/*.json identical to their source modules), and the index image, so
# a change that breaks the deployable artefact is caught here rather than at a
# deployment.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    env:
      # The folder the tests, the command and the EPCIS example read GS1's
      # files from. It is under node_modules, so it is never part of the tree.
      DPP_GS1_ARTEFACTS_DIR: ${{ github.workspace }}/node_modules/.cache/dpp-gs1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run build
      # GS1 publishes its EPCIS and resolver files under its own terms, so the
      # repository does not contain them. They are obtained from GS1 once and
      # checked against the pinned digests; the folder is cached under a key
      # made of the two tables that hold those digests, so a changed pin is a
      # new cache. Restored after npm ci, which replaces node_modules. The
      # command fetches the EPCIS files and the test set-up the resolver
      # files; with a warm cache neither fetches anything. A file that cannot
      # be obtained fails the job here or in the test set-up, never a skip.
      - uses: actions/cache@v5
        with:
          path: node_modules/.cache/dpp-gs1
          key: gs1-artefacts-${{ hashFiles('packages/dpp-credentials/src/gs1-artefacts.ts', 'packages/dpp-profiles/src/gs1-artefacts.ts') }}
      - run: node packages/dpp-credentials/dist/gs1-artefacts-cli.js fetch
      - run: npm run typecheck
      - run: npm test
      - run: node packages/dpp-credentials/dist/gs1-artefacts-cli.js verify
      - run: node examples/verify-passport.mjs --fixture
      - run: node examples/verify-passport.mjs --fixture --report
      - run: node examples/verify-passport.mjs --fixture --version=2
      - run: node examples/verify-passport.mjs --fixture --version=2 --report
      - run: node examples/lifecycle-v2.mjs
      - run: node examples/write-passport.mjs --dry-run
      - run: node examples/write-passport-v2.mjs --dry-run
      - run: node examples/sign-publisher-policy.mjs --dry-run
      - run: node examples/sample-payload.mjs --all
      - run: node examples/verify-anchor.mjs
      - run: node examples/verify-attestation-anchor.mjs
      - run: node examples/check-registry.mjs --fixture
      # The interoperability profiles, each from the built packages alone.
      - run: node examples/resolve-digital-link.mjs
      - run: node examples/import-epcis.mjs
      - run: node examples/verify-external-credential.mjs
      - run: node examples/project-passport.mjs
      # The documentation site: navigation, links, pinned repository paths,
      # example commands, version references and the two generated pages.
      - run: node scripts/docs-check.mjs

  # The clean consumer: the packed candidates installed into a project outside
  # this checkout, development dependencies omitted, every entry point imported
  # and type-checked, the reader path run on the fixtures.
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: node scripts/release-candidates.mjs
      - run: node scripts/consumer-check.mjs
      # The implementer bundle assembles from the same tree, so a file it
      # would refuse to carry is caught here.
      - run: node scripts/implementer-bundle.mjs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The base image comes from the first registry that serves it: Google's
      # Docker Hub mirror, Amazon ECR Public, then Docker Hub. All three serve
      # the same manifest digests, so one registry's anonymous pull limit or
      # outage cannot fail this job; the Dockerfile default stays node:22.23.4-slim
      # for platform and local builds.
      - run: |
          set -euo pipefail
          base=""
          for registry in mirror.gcr.io/library public.ecr.aws/docker/library docker.io/library; do
            if docker pull -q "$registry/node:22.23.4-slim"; then base="$registry/node:22.23.4-slim"; break; fi
          done
          [ -n "$base" ] || { echo "No registry served node:22.23.4-slim" >&2; exit 1; }
          docker build --build-arg BASE_IMAGE="$base" -f packages/dpp-overlay/Dockerfile -t dpp-overlay:ci .
      # A versioned smoke of the image: it boots on configuration alone,
      # answers /health and names its capabilities, under the operator
      # preset's container settings (node user, read-only, no capabilities, init).
      - run: |
          set -euo pipefail
          docker run -d --name smoke -p 18080:8080 \
            --user node --init --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e SERVICE_IDENTITY_KEY=02466d7fcae563e5cb09a0d1870bb580344804617879a14949cf22285f1bae3f27 \
            -e SUBMIT_TOKEN=smoke -e ARC_CALLBACK_TOKEN=smoke -e CHAIN_TRACKER=scripts-only \
            dpp-overlay:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/capabilities | head -c 400
          docker rm -f smoke
      # The operator preset: the Compose file resolves from its own example
      # configuration, and the image's connection command writes the four
      # settings an application reads.
      - run: |
          set -euo pipefail
          docker compose -f deploy/compose.yml --env-file deploy/operator.env.example config --quiet
          docker run --rm --user node --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e SERVICE_IDENTITY_KEY=02466d7fcae563e5cb09a0d1870bb580344804617879a14949cf22285f1bae3f27 \
            -e PUBLISHER_TOKENS_FILE=/tmp/publisher-tokens.json -e PUBLIC_URL=http://localhost:8080 -e NETWORK=test \
            dpp-overlay:ci node packages/dpp-overlay/dist/cli.js connection > connection.env
          grep -Eq '^INDEX_SUBMIT_TOKEN=[0-9a-f]{64}$' connection.env
          grep -Eq '^INDEX_CALLBACK_TOKEN=[0-9a-f]{64}$' connection.env
          grep -qx 'INDEX_URL=http://localhost:8080' connection.env
          rm connection.env

  # The starter: @bsv/create-dpp-app scaffolds an application from its bundled
  # template, pinned to the current release set. The CLI builds and tests,
  # then a scaffold in a temporary directory installs packed runtime candidates,
  # typechecks, builds and runs the template's offline lifecycle test, on the
  # oldest supported Node and the current LTS.
  starter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.23.4', '24.22.2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -w @bsv/create-dpp-app
      - run: npm run starter:check

  # The scaffolded application's image builds and its API answers /api/health.
  starter-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run starter:check -- --prepare-only --directory /tmp/my-dpp
      # The base image comes from the first registry that serves it, in the
      # same order as the overlay image above.
      - run: |
          set -euo pipefail
          base=""
          for registry in mirror.gcr.io/library public.ecr.aws/docker/library docker.io/library; do
            if docker pull -q "$registry/node:22.23.4-bookworm-slim"; then base="$registry/node:22.23.4-bookworm-slim"; break; fi
          done
          [ -n "$base" ] || { echo "No registry served node:22.23.4-bookworm-slim" >&2; exit 1; }
          docker build --build-arg BASE_IMAGE="$base" -f /tmp/my-dpp/.candidate.Dockerfile -t my-dpp /tmp/my-dpp
      - run: |
          set -euo pipefail
          docker run -d --name app -p 3000:3000 -e MONGO_URL=mongodb://127.0.0.1:1 -e PASSPORT_HOST=localhost:3000 my-dpp
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          docker rm -f app
