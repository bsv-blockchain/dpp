# The one image publication path, run manually, under the same approval as
# the npm publication: the SHA-256 of the reviewed publication plan
# (scripts/publish-candidates.mjs), reproduced here from the same committed
# revision. It builds the release set's images (the index and the validator
# service) for every platform the set names, labels them with the source
# revision, the release set and the package version, pushes each by digest
# to the registry the set names, reads each back, and uploads the digests as
# the evidence the operator preset is then pinned from.
#
# Nothing here runs on a push or a pull request. A run with dryRun left on,
# which is the default, builds, checks and rehearses the multi-platform
# build, and pushes nothing. Recording the digests in the release set is a
# reviewed change made afterwards with scripts/release-images.mjs pin; this
# workflow writes nothing to the repository.
#
# The registry is the one the release set names (images.registry). For
# ghcr.io the workflow signs in with its own token, which needs the packages
# permission below and no secret. Any other registry needs its credentials
# added here first, and the sign-in step refuses until they are.
name: Publish images
on:
  workflow_dispatch:
    inputs:
      releaseSet:
        description: Candidate filename under release; empty selects the current set
        required: false
        default: ""
      sourceRevision:
        description: Full release commit SHA in the dispatch ref's history (defaults to the dispatch commit)
        type: string
        required: false
      dryRun:
        description: Build, check and rehearse without pushing
        type: boolean
        default: true
      approval:
        description: SHA-256 of the reviewed publication plan, required to publish
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: dpp-image-publication
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      RELEASE_SET: ${{ inputs.releaseSet }}
      APPROVED_PLAN: ${{ inputs.approval }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the release commit
        if: ${{ inputs.sourceRevision != '' }}
        env:
          SOURCE_REVISION: ${{ inputs.sourceRevision }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git cat-file -t "$SOURCE_REVISION")" != commit ]]; then
            echo "Use a full lowercase commit SHA from the dispatch history." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_REVISION" "$GITHUB_SHA"; then
            echo "The release commit must be an ancestor of the dispatch commit." >&2
            exit 1
          fi
          git switch --detach "$SOURCE_REVISION"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - run: npm install --global npm@11.19.0
      - name: Validate publication inputs
        if: ${{ !inputs.dryRun }}
        run: |
          node --input-type=module <<'JS'
          if (!/^[a-f0-9]{64}$/.test(process.env.APPROVED_PLAN ?? '')) throw new Error('the exact publication plan digest is required')
          JS
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Select the candidate
        id: set
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { currentReleaseSet } from './scripts/lib/candidates.mjs'
          const name = process.env.RELEASE_SET
          if (name && !/^dpp-release-[a-z0-9-]+\.json$/.test(name)) throw new Error('invalid release set filename')
          const path = name ? `release/${name}` : currentReleaseSet(process.cwd()).path
          const set = JSON.parse(readFileSync(path, 'utf8'))
          if (set.status !== 'candidate') throw new Error('select a candidate')
          if (!/^conformance\/selections\/[a-z0-9-]+\.json$/.test(set.selection)) throw new Error('invalid selection path')
          if (set.images == null) throw new Error('the set declares no images')
          if (!/^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(\/[a-z0-9][a-z0-9._-]*)*$/.test(set.images.registry)) throw new Error('invalid registry')
          const overlay = set.images.own.find((image) => image.service === 'overlay')
          const validator = set.images.own.find((image) => image.service === 'validator')
          const base = [...new Set(set.images.own.map((image) => image.runtime.baseImage))]
          if (overlay == null || validator == null || base.length !== 1 || !/^node:[0-9.]+-slim(?:@sha256:[0-9a-f]{64})?$/.test(base[0])) throw new Error('the set does not name the index and validator images on one base image')
          appendFileSync(process.env.GITHUB_OUTPUT, `path=${path}\nselection=${set.selection}\nregistry=${set.images.registry}\nhost=${set.images.registry.split('/')[0]}\nbase=${base[0]}\noverlay=${overlay.name}\nvalidator=${validator.name}\n`)
          JS
      - name: Pack, qualify and plan
        env:
          SET_PATH: ${{ steps.set.outputs.path }}
          SELECTION: ${{ steps.set.outputs.selection }}
        run: |
          set -euo pipefail
          node scripts/release-candidates.mjs "$SET_PATH"
          node scripts/consumer-check.mjs
          node conformance/qualify.mjs "$SELECTION"
          node scripts/publish-candidates.mjs
          node scripts/release-images.mjs check
          node scripts/publish-images.mjs
      - name: Confirm the rebuilt publication plan
        if: ${{ !inputs.dryRun }}
        run: |
          set -euo pipefail
          printf '%s  release/publication-plan.json\n' "$APPROVED_PLAN" | sha256sum -c -
          jq -e --arg revision "$(git rev-parse HEAD)" '.sourceRevision == $revision and .sourceState == "committed"' release/publication-plan.json
      # The base image comes from the first registry that serves it, in the
      # same order as every other workflow: Google's Docker Hub mirror, Amazon
      # ECR Public, then Docker Hub. All three serve the same manifest digests.
      - name: Find the base image
        id: base
        env:
          BASE: ${{ steps.set.outputs.base }}
        run: |
          set -euo pipefail
          base=""
          for registry in mirror.gcr.io/library public.ecr.aws/docker/library docker.io/library; do
            if docker pull -q "$registry/$BASE"; then base="$registry/$BASE"; break; fi
          done
          [ -n "$base" ] || { echo "No registry served $BASE" >&2; exit 1; }
          echo "image=$base" >> "$GITHUB_OUTPUT"
      # First for this runner alone, loaded into Docker, so that what is about
      # to be published is read and exercised before anything leaves here:
      # the labels, what each image contains, the validator image by itself,
      # and both deliveries held to one another.
      - name: Build and check on this runner
        env:
          BASE: ${{ steps.base.outputs.image }}
          OVERLAY: ${{ steps.set.outputs.overlay }}
          VALIDATOR: ${{ steps.set.outputs.validator }}
        run: |
          set -euo pipefail
          node scripts/release-images.mjs build --prefix release- --tag check --base-image "$BASE"
          node scripts/image-contents-check.mjs --overlay-image "release-$OVERLAY:check" --validator-image "release-$VALIDATOR:check" --record release/image-contents.json
          node scripts/validator-image-check.mjs --image "release-$VALIDATOR:check"
          node scripts/delivery-parity.mjs --overlay-image "release-$OVERLAY:check" --validator-image "release-$VALIDATOR:check" --record release/delivery-parity.json
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Rehearse the multi-platform build
        if: ${{ inputs.dryRun }}
        env:
          BASE: ${{ steps.base.outputs.image }}
        run: node scripts/publish-images.mjs --rehearse --base-image "$BASE"
      - name: Refuse a registry this workflow has no credentials for
        if: ${{ !inputs.dryRun && steps.set.outputs.host != 'ghcr.io' }}
        env:
          HOST: ${{ steps.set.outputs.host }}
        run: |
          echo "The release set names $HOST. This workflow signs in to ghcr.io only; add the sign-in for $HOST before publishing there." >&2
          exit 1
      - name: Sign in to the registry
        if: ${{ !inputs.dryRun }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish approved images
        if: ${{ !inputs.dryRun }}
        env:
          BASE: ${{ steps.base.outputs.image }}
        run: node scripts/publish-images.mjs --execute --approval="$APPROVED_PLAN" --base-image "$BASE"
      # The published images, pulled by their digests and started by the
      # unchanged preset, held to the npm candidates once more. This is the
      # only place the preset is started from a registry digest before an
      # operator does it.
      - name: Check the published images
        if: ${{ !inputs.dryRun }}
        env:
          REGISTRY: ${{ steps.set.outputs.registry }}
          OVERLAY: ${{ steps.set.outputs.overlay }}
          VALIDATOR: ${{ steps.set.outputs.validator }}
        run: |
          set -euo pipefail
          overlay=$(node -e 'const e = require("./release/image-digests.json"); console.log(e.images.find((i) => i.name === process.argv[1]).digest)' "$OVERLAY")
          validator=$(node -e 'const e = require("./release/image-digests.json"); console.log(e.images.find((i) => i.name === process.argv[1]).digest)' "$VALIDATOR")
          node scripts/image-contents-check.mjs --overlay-image "$REGISTRY/$OVERLAY@$overlay" --validator-image "$REGISTRY/$VALIDATOR@$validator" --record release/image-contents-published.json
          node scripts/delivery-parity.mjs --overlay-image "$REGISTRY/$OVERLAY@$overlay" --validator-image "$REGISTRY/$VALIDATOR@$validator" --record release/delivery-parity-published.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-images
          path: |
            release/candidates.json
            release/publication-plan.json
            release/image-digests.json
            release/image-contents*.json
            release/delivery-parity*.json
