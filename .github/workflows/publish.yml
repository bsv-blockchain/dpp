# Manual npm publication. The dry run prints a deterministic plan digest;
# execution must reproduce that exact plan from the same committed revision.
name: Publish npm candidates
on:
  workflow_dispatch:
    inputs:
      releaseSet:
        description: Candidate filename under release; empty selects the current set
        required: false
        default: ""
      dryRun:
        description: Prepare and validate without publishing
        type: boolean
        default: true
      approval:
        description: SHA-256 of the reviewed publication plan, required to publish
        required: false
      provenance:
        description: Provenance requires a public source repository; false must be explicitly reviewed
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: dpp-npm-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_SET: ${{ inputs.releaseSet }}
      APPROVED_PLAN: ${{ inputs.approval }}
      PROVENANCE: ${{ inputs.provenance }}
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - name: Validate publication inputs
        if: ${{ !inputs.dryRun }}
        run: |
          node --input-type=module <<'JS'
          if (!/^[a-f0-9]{64}$/.test(process.env.APPROVED_PLAN ?? '')) throw new Error('the exact publication plan digest is required')
          if (process.env.PROVENANCE === 'true' && process.env.GITHUB_REPOSITORY_VISIBILITY !== 'public') throw new Error('npm provenance requires a public source repository')
          JS
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Select the candidate
        id: set
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { currentReleaseSet } from './scripts/lib/candidates.mjs'
          const name = process.env.RELEASE_SET
          if (name && !/^dpp-release-[a-z0-9-]+\.json$/.test(name)) throw new Error('invalid release set filename')
          const path = name ? `release/${name}` : currentReleaseSet(process.cwd()).path
          const set = JSON.parse(readFileSync(path, 'utf8'))
          if (set.status !== 'candidate') throw new Error('select a candidate')
          if (!/^conformance\/selections\/[a-z0-9-]+\.json$/.test(set.selection)) throw new Error('invalid selection path')
          appendFileSync(process.env.GITHUB_OUTPUT, `path=${path}\nselection=${set.selection}\n`)
          JS
      - name: Pack and qualify
        env:
          SET_PATH: ${{ steps.set.outputs.path }}
          SELECTION: ${{ steps.set.outputs.selection }}
        run: |
          set -euo pipefail
          node scripts/release-candidates.mjs "$SET_PATH"
          node scripts/consumer-check.mjs
          node scripts/implementer-bundle.mjs "$SET_PATH"
          node conformance/qualify.mjs "$SELECTION"
      - name: Build and smoke the operator image locally
        run: |
          set -euo pipefail
          docker build -f packages/overlay-topics/Dockerfile -t dpp-overlay:release-check .
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke -p 18080:8080 \
            -e SERVICE_IDENTITY_KEY=02466d7fcae563e5cb09a0d1870bb580344804617879a14949cf22285f1bae3f27 \
            -e SUBMIT_TOKEN=smoke -e ARC_CALLBACK_TOKEN=smoke -e CHAIN_TRACKER=scripts-only \
            dpp-overlay:release-check
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18080/capabilities > /tmp/capabilities.json
          node -e 'const c = require("/tmp/capabilities.json"); if (!c.profiles?.length) process.exit(1)'
      - name: Prepare the exact publication plan
        run: node scripts/publish-candidates.mjs --provenance="$PROVENANCE"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: |
            release/candidates/
            release/candidates.json
            release/publication-plan.json
            release/dpp-implementer-bundle-*.tgz
      - name: Publish approved packages
        if: ${{ !inputs.dryRun }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-candidates.mjs --execute --approval="$APPROVED_PLAN" --provenance="$PROVENANCE"
      - name: Verify public registry consumption
        if: ${{ !inputs.dryRun }}
        run: node scripts/consumer-check.mjs --registry
