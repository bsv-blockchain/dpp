# MongoDB for the application's records and sign-in. Start it with:
#
#   docker compose -f deploy/compose.yml --env-file .env up -d
#
# Connect the app to an existing index with INDEX_URL and its access tokens,
# or operate one in a separate project made with @bsv/create-dpp-index.
# This Compose file does not start an index. See README.md, Connect an index.
name: dpp-platform

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
